<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control · Circuit Rebels</title>
<link rel="icon" href="/img/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Mission Control (docs/platform-flow-spec.md section 8): the board runs a story mission for the class. The picker,
     then the five steps across the top, the current step big (left), and the controls and class progress (right).
     Made for a projector. */
  body { background: #0d0c10; }
  .scenebg { position: fixed; inset: 0; z-index: -1; background: #1b1a1e center / cover no-repeat; }
  .scenebg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,12,16,.6), rgba(13,12,16,.92) 60%); }
  .wrap { max-width: 1600px; }
  .headright { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-family: var(--mono); font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .kick { font-family: var(--mono); font-size: 14px; letter-spacing: .16em; color: var(--orange-hi); }
  .mc { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .mc { grid-template-columns: minmax(0, 1fr); } }
  .stage, .side .panel { display: grid; gap: 14px; align-content: start; }
  .stage { padding: 26px 30px; min-height: 460px; background: rgba(27,26,30,.94); }
  .stage h2 { margin: 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; text-wrap: balance; }
  .stage > .btn { justify-self: start; }
  .stage p { margin: 0; font-size: 20px; color: #d9d5de; max-width: 62ch; }
  .side { display: grid; gap: 12px; }
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 4px 0 14px; }
  .steps button { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(27,26,30,.9); color: var(--fg); font: inherit; cursor: pointer; }
  .steps button .n { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .steps button b { font-family: var(--display); font-size: 19px; }
  .steps button.future { opacity: .75; }
  .steps button.past { border-color: var(--good); } .steps button.cur { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
  .picks { display: grid; gap: 12px; }
  .pick { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); }
  .pick .art { width: 180px; aspect-ratio: 16 / 9; border-radius: 10px; background: #3a3842 center / cover; }
  .pick h3 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--fg); display: block; }
  .pick .sum { font-size: 17px; color: var(--muted); margin: 4px 0 10px; }
  .pick .badge { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; padding: 3px 8px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
  .pick .badge.next { background: var(--orange); color: var(--ink); } .pick .badge.done { border: 1px solid var(--good); color: var(--good); }
  @media (max-width: 640px) { .pick { grid-template-columns: minmax(0, 1fr); } .pick .art { width: 100%; } }
  .mstats { display: grid; gap: 8px; } /* not .stats: style.css already uses that name */
  .mstat { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: grid; gap: 4px; }
  .mstat b { font-family: var(--display); font-size: 20px; }
  .mstat span { font-size: 17px; color: #d9d5de; }
  .reward { padding: 14px; border-radius: 14px; border: 1.5px solid var(--gold); background: #ffd23f12; }
  .reward b { font-family: var(--display); font-size: 22px; color: var(--gold); display: block; }
  .count { display: flex; align-items: baseline; gap: 10px; } .count b { font-family: var(--mono); font-size: 40px; } .count span { color: var(--muted); font-size: 17px; }
  .actions { display: grid; gap: 8px; }
  .note { font-size: 16px; color: var(--muted); }
</style>
</head>
<body data-page="host">
<div class="scenebg" id="scenebg"></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-tip="Go to the Circuit Rebels home page.">
      <img class="logo" src="/img/logo.svg" alt="">
      <div><small>Circuit Rebels</small><h1 style="font-size:28px">Mission Control</h1></div>
    </a>
    <div class="headright">
      <span class="pill" id="status">Connecting...</span>
      <a class="btn ghost" id="toboard" href="/host" style="padding:8px 14px" data-tip="Go back to the game board. The class keeps its place in the mission until you end it.">Back to the game board</a>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<script src="/js/tips.js"></script>
<script src="/js/tiers.js"></script>
<script src="/js/story.js"></script>
<script src="/js/storyplayer.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  // this tab is the game's host (opened from the board, same tab, so it has the game's ba-host)
  if (window.io) window.baSocket = io();
</script>
<script src="/js/presence.js"></script>
<script src="/js/control.js"></script>
</body>
</html>
