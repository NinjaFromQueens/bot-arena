<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo Lab · Circuit Rebels</title>
<meta name="description" content="Echo Lab: check old photos for edits. A date that can't be right, a shadow that doesn't match, copies that disagree.">
<link rel="icon" href="/img/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Echo Lab (ECHO-1, ECHO-2; docs/echo-lab-plan.md): the Archive's desk. One recovered Echo fills the screen under a
     lamp, and every check answers back (the camera moves in, a scan sweeps, a stamp lands, a card goes up on the
     evidence board). The Echo is art; the evidence layer is code, in the UI colors. */
  body { background: #0d0c10; }
  body.painted { background: linear-gradient(rgba(10,9,12,.84), rgba(10,9,12,.92)), #0d0c10 url("/assets/scenes/archive.webp") center / cover fixed no-repeat; }
  .wrap { max-width: 1480px; }
  .top { margin-bottom: 10px; }
  .kick { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; color: var(--orange-hi); }
  .intro { display: grid; gap: 6px; margin: 6px 0 16px; }
  .intro h2 { margin: 0; font-size: clamp(26px, 4vw, 40px); color: var(--fg); }
  .intro p { margin: 0; font-size: 18px; color: #d9d5de; max-width: 66ch; }
  .say { display: flex; gap: 10px; align-items: baseline; }
  .say b { font-family: var(--display); color: var(--orange-hi); white-space: nowrap; }

  /* ---- free play: the Echoes as prints on the desk ---- */
  .prints { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 26px 22px; padding: 6px 4px 20px; }
  .print { position: relative; display: grid; gap: 10px; align-content: start; padding: 12px 12px 16px; background: #f1e9da; color: #241d14; border-radius: 4px; box-shadow: 0 14px 30px rgba(0,0,0,.5); transform: rotate(var(--tilt, -1.2deg)); transition: transform .2s ease, box-shadow .2s ease; text-decoration: none; }
  .print:nth-child(even) { --tilt: 1.4deg; } .print:nth-child(3n) { --tilt: -0.4deg; }
  .print:hover, .print:focus-visible { transform: rotate(0) translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,.6); outline: none; }
  .print:focus-visible { box-shadow: 0 0 0 4px var(--orange-hi), 0 20px 40px rgba(0,0,0,.6); }
  .print .pic { position: relative; aspect-ratio: 16 / 9; background: #3a3842 center / cover no-repeat; border-radius: 2px; overflow: hidden; }
  .print .pic.stack { box-shadow: 6px -6px 0 #d9cfbd, 12px -12px 0 #c6bba8; margin: 12px 12px 0 0; }
  .print .pic .ph { position: absolute; inset: 0; display: grid; place-content: center; padding: 8px; text-align: center; color: #e8e4ec; font-family: var(--mono); font-size: 12px; }
  .print .kick { color: #a04a14; font-size: 12px; }
  .print h3 { margin: 0; font-size: 22px; letter-spacing: 0; text-transform: none; color: #241d14; display: block; }
  .print p { margin: 0; font-size: 16px; color: #4a3f31; }
  .print .st { font-family: var(--mono); font-size: 12px; color: #6b5d4b; }
  .print .go { justify-self: start; margin-top: 2px; }
  .solved { position: absolute; right: 18px; top: 26px; padding: 6px 12px; border: 4px solid #1f8a54; color: #1f8a54; font: 700 22px var(--display); letter-spacing: .08em; transform: rotate(-10deg); background: rgba(241,233,218,.6); border-radius: 6px; }

  /* ---- the desk ---- */
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
  @media (max-width: 920px) { .desk { grid-template-columns: minmax(0, 1fr); } }
  .stagecol { display: grid; gap: 10px; min-width: 0; justify-items: center; }
  .photo { position: relative; width: min(100%, calc((100svh - 108px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #2a2730; border: 3px solid #7a6446; box-shadow: 0 0 0 6px #2b231b, 0 18px 50px rgba(0,0,0,.6), 0 0 120px rgba(255,190,110,.10); touch-action: manipulation; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .55s cubic-bezier(.2,.75,.25,1); }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .photo .ph { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; padding: 16px; text-align: center; background: #3a3842; color: #d8d4dc; font-family: var(--mono); font-size: 13px; }
  .photo .ph b { color: #fff; font-size: 15px; overflow-wrap: anywhere; }
  .label { position: absolute; left: 12px; top: 12px; padding: 5px 11px; border-radius: 6px; background: rgba(12,11,15,.84); color: #f2eee6; font-family: var(--mono); font-size: 14px; z-index: 4; }
  .spot { position: absolute; transform: translate(-50%, -50%); min-width: 44px; min-height: 44px; aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,.9); background: rgba(10,9,12,.15); cursor: zoom-in; padding: 0; box-shadow: 0 0 0 2px rgba(0,0,0,.35); transition: background .15s, border-color .15s, opacity .2s; }
  .spot:hover, .spot:focus-visible { background: rgba(244,101,36,.22); outline: none; border-color: var(--orange-hi); }
  .spot.seen { border-style: solid; border-color: #ffd36b; cursor: pointer; }
  .spot.seen::after { content: "✓"; position: absolute; right: -6px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: #3fbf7f; color: #062b18; font: 700 15px var(--display); display: grid; place-items: center; box-shadow: 0 0 0 2px #0d0c10; }
  .spot.seen.bad { border-color: #ff6b6b; }
  .spot.seen.bad::after { content: "✗"; background: #ff5d5d; color: #2b0606; }
  .zoomed .spot { opacity: 0; pointer-events: none; }
  .arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .arrows .ar { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .45s ease-out forwards; }
  .arrows text { font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: #111; stroke-width: .9px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .dusk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at var(--sx, 10%) var(--sy, 10%), rgba(255,214,120,.32) 0, rgba(255,214,120,.06) 16%, rgba(8,7,12,.66) 42%, rgba(8,7,12,.74)); z-index: 2; pointer-events: none; animation: fadein .4s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .scanring { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid var(--orange-hi); background: conic-gradient(from 0deg, transparent 0 70%, rgba(255,160,90,.55) 92%, transparent); animation: spin .65s linear, fadein .15s ease; box-shadow: 0 0 30px rgba(255,138,80,.5); }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .stamp { position: absolute; transform: translate(-50%, -50%) rotate(-8deg); padding: 6px 14px; border: 4px solid currentColor; border-radius: 8px; font: 700 clamp(16px, 2.2vw, 28px) var(--display); letter-spacing: .06em; white-space: nowrap; background: rgba(13,12,16,.72); animation: stampin .32s cubic-bezier(.2,1.5,.4,1); }
  .stamp.good { color: #4fd18b; } .stamp.bad { color: #ff6b6b; }
  @keyframes stampin { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.2); opacity: 0; } }
  .glitch { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; backdrop-filter: hue-rotate(170deg) saturate(2.6) contrast(1.35); -webkit-backdrop-filter: hue-rotate(170deg) saturate(2.6) contrast(1.35); animation: glitch .9s steps(7) forwards; }
  @keyframes glitch { 0% { clip-path: inset(10% 0 60% 0); translate: -6px 0; } 30% { clip-path: inset(50% 0 20% 0); translate: 5px 0; } 60% { clip-path: inset(20% 0 40% 0); translate: -3px 0; } 99% { clip-path: inset(0 0 0 0); translate: 0; opacity: 1; } 100% { opacity: 0; } }
  .lens { position: absolute; width: 210px; height: 210px; border-radius: 50%; border: 4px solid #c9a46a; box-shadow: 0 0 0 3px #2b231b, 0 10px 30px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.35); background-repeat: no-repeat; pointer-events: none; z-index: 6; transform: translate(-50%, -50%); display: none; }
  .lens.on { display: block; }
  .photo.clue-top .label { display: none; }
  @media (max-width: 600px) { .label { font-size: 11px; padding: 3px 7px; left: 8px; top: 8px; } .cluebox { font-size: 15px; } .stamp { padding: 3px 8px; border-width: 3px; } }
  .cluebox.top { bottom: auto; top: 14px; }
  .cluebox { position: absolute; left: 50%; bottom: 14px; width: min(760px, calc(100% - 28px)); transform: translateX(-50%); z-index: 7; border: 22px solid transparent; border-image: url("/assets/ui/dialog_frame.webp") 110 fill / 22px stretch; background-clip: padding-box; color: #f2eee6; font-size: clamp(16px, 1.6vw, 20px); line-height: 1.35; padding: 2px 6px; animation: fadein .25s ease; }
  .cluebox b { color: var(--orange-hi); font-family: var(--display); }
  .cluebox .x { float: right; margin: -2px -4px 0 10px; }
  .bigstamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-12deg); z-index: 8; padding: 10px 26px; border: 9px solid currentColor; border-radius: 14px; font: 700 clamp(34px, 6vw, 84px) var(--display); letter-spacing: .08em; background: rgba(13,12,16,.55); animation: bigin .38s cubic-bezier(.2,1.5,.4,1); text-align: center; line-height: 1; }
  .bigstamp small { display: block; font-size: .32em; letter-spacing: .14em; margin-bottom: 6px; }
  .bigstamp.good { color: #4fd18b; } .bigstamp.bad { color: #ff6b6b; }
  .bigstamp.second { top: 70%; transform: translate(-50%, -50%) rotate(6deg); font-size: clamp(22px, 3.4vw, 46px); }
  @keyframes bigin { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); opacity: 0; } }
  .slideout-l { animation: outl .55s ease-in forwards; } .slideout-r { animation: outr .55s ease-in forwards; }
  @keyframes outl { to { transform: translateX(-60%) rotate(-6deg); opacity: 0; } } @keyframes outr { to { transform: translateX(60%) rotate(6deg); opacity: 0; } }
  .backbtn { position: absolute; right: 12px; top: 12px; z-index: 9; }

  /* the light table and the record: sheets over the photo (full screen on a phone) */
  .sheet { position: absolute; inset: 0; z-index: 10; background: rgba(13,12,16,.92); backdrop-filter: blur(3px); display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 14px; animation: fadein .2s ease; overflow: auto; }
  .sheet h3 { margin: 0; font-size: 20px; color: var(--fg); display: flex; justify-content: space-between; align-items: center; gap: 10px; text-transform: none; letter-spacing: 0; }
  .sheet .lead { margin: 0; color: #d9d5de; font-size: 16px; }
  .table3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; align-content: start; }
  .copy { display: grid; gap: 6px; padding: 8px; border-radius: 10px; background: #f1e9da; color: #241d14; transform: rotate(var(--tilt, 0)); }
  .copy:nth-child(1) { --tilt: -1deg; } .copy:nth-child(3) { --tilt: 1deg; }
  .copy .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #3a3842 center / cover no-repeat; }
  .copy .ring { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #ffd36b; aspect-ratio: 1; box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
  .copy.odd .ring { border-color: #ff5d5d; }
  .copy b { font-family: var(--display); font-size: 16px; }
  .copy small { font-family: var(--mono); font-size: 12px; color: #6b5d4b; }
  .copy .shows { font-size: 15px; }
  .copy.mine { box-shadow: 0 0 0 3px var(--orange); }
  .copy .tag { justify-self: start; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--orange); color: #fff; }
  .sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .term { background: #eef4fb; color: #16324f; border-radius: 10px; padding: 14px 16px; font: 500 15px/1.6 var(--mono); box-shadow: inset 0 0 0 2px #9cc4ea; align-self: start; }
  .term .hd { color: #2f7fc4; letter-spacing: .12em; font-size: 12px; margin-bottom: 6px; }
  .term .ln.bad { color: #c8102e; font-weight: 700; }
  .term .cur::after { content: "▍"; animation: blinkc .8s steps(2) infinite; } @keyframes blinkc { 50% { opacity: 0; } }
  @media (max-width: 920px) { .sheet { position: fixed; inset: 0; z-index: 40; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); } }

  /* the set's tray of five, above the photo */
  .tray { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .tray span { position: relative; width: 74px; aspect-ratio: 16 / 9; border-radius: 4px; background: #3a3842 center / cover no-repeat; box-shadow: 0 0 0 2px #2b231b; opacity: .55; }
  .tray span.now { opacity: 1; box-shadow: 0 0 0 3px var(--orange); }
  .tray span.home::after, .tray span.left::after { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--mono); letter-spacing: .06em; background: rgba(13,12,16,.6); color: #fff; }
  .tray span.home::after { content: "HOME"; } .tray span.left::after { content: "LEFT"; }

  /* ---- the side: the case, the first call, the tools, the evidence board, the verdict ---- */
  .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: sticky; top: 10px; max-height: calc(100svh - 20px); }
  @media (max-width: 920px) { .side { position: static; max-height: none; } }
  .casehead { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: start; }
  .volt { position: relative; width: 58px; height: 58px; }
  .volt img { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .volt.talk img { animation: bob .5s ease 2; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
  .volt .bub { position: absolute; left: 34px; top: -20px; padding: 2px 8px; border-radius: 10px 10px 10px 2px; background: #f2eee6; color: #241d14; font: 700 13px var(--mono); white-space: nowrap; animation: fadein .15s ease; }
  .casehead h2 { margin: 0; font-size: 22px; line-height: 1.1; color: var(--fg); }
  .casehead p { margin: 4px 0 0; font-size: 15px; color: #d9d5de; }
  .casehead p b { color: var(--orange-hi); font-family: var(--display); }
  .side .pcard { padding: 10px; gap: 8px; }
  .side .pcard .popts { grid-template-columns: 1fr 1fr; }
  .side .pcard h3, .side .pcard .pq { font-size: 15px; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--panel-hi, #24232b); border: 1.5px solid var(--line); font-size: 15px; }
  .strip b { color: var(--fg); } .strip span { color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .tool { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font: 600 15px var(--body); cursor: pointer; text-align: left; }
  .tool:hover, .tool:focus-visible { border-color: var(--orange); outline: none; }
  .tool .ic { font-size: 20px; line-height: 1; }
  .tool.used { border-color: #ffd36b; }
  .tool[aria-pressed="false"] { opacity: .7; }
  .board { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1 1 auto; }
  .board .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .board .hd b { font: 700 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .meter { display: flex; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--muted); }
  .meter i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .meter i.on { background: #ffd36b; }
  .cards { display: grid; gap: 6px; overflow: auto; min-height: 60px; padding-right: 2px; }
  .ev { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; line-height: 1.25; text-align: left; color: var(--fg); cursor: pointer; animation: cardin .35s ease; }
  .ev:hover, .ev:focus-visible { border-color: var(--orange); outline: none; }
  @keyframes cardin { from { transform: translateX(24px); opacity: 0; } }
  .ev .th { width: 54px; height: 54px; border-radius: 7px; background: #3a3842 no-repeat; display: grid; place-items: center; font-size: 26px; }
  .ev .chip { display: inline-block; margin-top: 3px; font: 700 11px var(--mono); letter-spacing: .06em; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .ev .chip.good { color: #4fd18b; } .ev .chip.bad { color: #ff6b6b; } .ev .chip.info { color: #8fc3ff; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px; border: 1px dashed var(--line); border-radius: 9px; }
  .verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .verdicts .btn { font-size: 19px; padding: 12px 8px; }
  .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font: 500 12px var(--mono); color: var(--muted); }
  .piles div { padding: 6px 8px; border-radius: 8px; border: 1px dashed var(--line); }
  .piles b { color: var(--fg); font-size: 15px; }

  /* the result */
  #result { display: grid; gap: 10px; margin-top: 16px; }
  .reveal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; perspective: 900px; }
  .rv { position: relative; aspect-ratio: 16 / 11; transform-style: preserve-3d; animation: flip .6s ease both; }
  @keyframes flip { from { transform: rotateY(180deg); } }
  .rv .face { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; gap: 4px; padding: 6px; border-radius: 6px; background: #f1e9da; color: #241d14; backface-visibility: hidden; }
  .rv .pic { border-radius: 3px; background: #3a3842 center / cover no-repeat; position: relative; }
  .rv .mini { position: absolute; right: 6px; top: 6px; padding: 2px 8px; border: 3px solid currentColor; border-radius: 5px; font: 700 14px var(--display); background: rgba(241,233,218,.85); transform: rotate(-8deg); }
  .rv .mini.good { color: #1f8a54; } .rv .mini.bad { color: #c8102e; }
  .rv .cap { font-size: 13px; line-height: 1.2; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .nudge { animation: nudge .5s ease; } @keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    .cam { transition: none; } .nudge, .stamp, .bigstamp, .scanring, .glitch, .ev, .rv, .volt.talk img, .arrows .ar, .print, .dusk::before, .cluebox, .sheet { animation: none !important; transition: none !important; }
    .arrows .ar { stroke-dashoffset: 0; } .slideout-l, .slideout-r { animation: none; }
  }
  /* the explain card (cards.js), as on the Lab and Racer pages */
  .headline { font-family: var(--display); font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .headline.good { color: var(--good); } .headline.bad { color: var(--bad); }
  .headline .stars { font-size: 20px; }
  .finding { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); animation: logIn .3s ease-out both; }
  .finding .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--ink); }
  .finding.good .ic { background: var(--good); } .finding.bad .ic { background: var(--bad); } .finding.info .ic { background: var(--blue); }
  .finding.bad { border-color: #ff5d5d55; }
  .finding h4 { margin: 0 0 2px; font-family: var(--display); font-size: 16px; }
  .finding p { color: #d9d5de; font-size: 15px; }
  .tipbox { padding: 12px 14px; border-radius: 12px; border: 1.5px dashed var(--orange); background: var(--orange-soft); font-size: 16px; }
  .tipbox b { font-family: var(--display); color: var(--orange-hi); display: block; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  #result .finding p { margin: 0; }
  #result > div:not(.verdict):not(.acts):not(.reveal) { display: grid; gap: 8px; }
  @keyframes logIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body data-page="echo">
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-tip="Go to the Circuit Rebels home page.">
      <img class="logo" src="/img/logo.svg" alt="">
      <div><small>Circuit Rebels</small><h1 style="font-size:28px">Echo Lab</h1></div>
    </a>
    <div class="headright">
      <button class="btn ghost" id="snd" type="button" style="padding:8px 14px" data-tip="Turn the Archive's music and sounds on or off. They start off.">Sound: off</button>
