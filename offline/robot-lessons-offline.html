        { type: "interactive", kind: "lidar" },
        { type: "read", html: `<h3>What lidar can't see</h3>
          <ul><li><b>Behind things.</b> The laser stops at the first thing it hits. That's why you had to drive around the mystery shape.</li>
          <li><b>Clear glass.</b> The laser goes right through, so a glass door can look like an open doorway.</li>
          <li><b>Mirrors</b> bounce the laser away, and <b>fog or heavy rain</b> scatters it.</li></ul>` },
        { type: "quiz", q: "Light travels about 30 cm every nanosecond. A laser flash comes back after 20 nanoseconds. How far away is the object?", options: ["0.3 m", "3 m", "6 m", "20 m"], answer: 1, explain: "In 20 ns light goes 20 × 0.3 m = 6 m. That's there and back, so the object is 3 m away." },
        { type: "quiz", q: "Why does a robot vacuum's lidar spin?", options: ["To keep the laser cool", "To measure in every direction and build a map", "To suck up more dust", "To make a humming sound"], answer: 1, explain: "One laser beam measures one spot. Spinning sweeps it all the way around, thousands of times, to map the room." },
        { type: "quiz", q: "In the mystery room, why did you have to drive around the shape?", options: ["The laser was too weak", "Lidar only sees the sides its laser can reach", "The shape kept moving"], answer: 1, explain: "The laser can't go through things, so the back of the shape stays hidden until you look from another side." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "showdown", n: "Sensor showdown", about: "Ultrasonic vs. lidar vs. infrared: find each sensor's blind spot.",
      steps: [
        { type: "read", html: `<p class="big">Every sensor has a blind spot. Engineers pick the right one for the job.</p>
          <table class="rtab"><thead><tr><th>Sensor</th><th>Range</th><th>Gets fooled by</th></tr></thead><tbody>
          <tr><td><b>Ultrasonic</b><small>sound</small></td><td>up to about 4 m, wide cone</td><td>soft things, tilted walls</td></tr>
          <tr><td><b>Lidar</b><small>laser light</small></td><td>12 m or more, one exact spot</td><td>clear glass, mirrors</td></tr>
          <tr><td><b>Infrared</b><small>invisible light</small></td><td>short: often under 1 m</td><td>black things, clear glass, bright sunlight</td></tr>
          <tr><td><b>Camera</b><small>pictures</small></td><td>as far as it can see</td><td>darkness. One camera can't easily tell how far away things are.</td></tr>
          <tr><td><b>Touch</b><small>a button</small></td><td>none: only when it bumps</td><td>nothing, but it only knows after it hits</td></tr>
          </tbody></table>
          <p class="small">Ranges are for common, low-cost sensors like the ones in school robot kits.</p>
          <p><b>Infrared</b> sensors shine invisible light (the same kind a TV remote uses) and measure the light that bounces back.</p>` },
        { type: "interactive", kind: "showdown" },
        { type: "read", html: `<h3>Sensor fusion: use a team</h3>
          <p>Real robots use <b>more than one kind of sensor</b>, so when one gets fooled, another catches it. That's called <b>sensor fusion</b>.</p>
          <ul><li><b>Robot vacuums:</b> lidar to map, bump sensors for anything it missed, and infrared cliff sensors underneath so it doesn't fall down the stairs.</li>
          <li><b>Self-driving cars:</b> cameras to read signs and traffic lights, radar to see through rain, and lidar to measure exact shapes.</li></ul>
          <p>In Bot Arena your robot gets one sensor, so pick the one that fits your plan!</p>` },
        { type: "quiz", q: "A robot vacuum keeps bumping into a glass door. Its lidar says the way is clear. Which sensor would notice the door?", options: ["A stronger laser", "Ultrasonic, because sound bounces off glass", "Infrared", "A camera"], answer: 1, explain: "Light goes right through clear glass, but sound bounces off it. An ultrasonic sensor hears the door." },
        { type: "quiz", q: "Some robot vacuums won't drive onto a black rug. Why?", options: ["Black rugs are too heavy", "Their infrared cliff sensors get almost no light back, so the rug looks like a drop-off", "The rug soaks up the lidar", "The rug is too far away"], answer: 1, explain: "Cliff sensors shine infrared light at the floor. Black soaks it up, so the vacuum thinks it's at the top of the stairs." },
        { type: "quiz", q: "What is sensor fusion?", options: ["Melting two sensors together", "Using different sensors together so one catches what another misses", "Using the most expensive sensor", "Turning sensors off to save power"], answer: 1, explain: "No sensor is perfect. A team of different sensors covers each other's blind spots." },
      ],
      next: { label: "Pick the best sensor for your robot", href: "bot-arena-offline.html" },
    },
    {
      id: "rules", n: "Think: if-then rules", about: "How a robot decides what to do, why the order of its rules matters, and your Bot Arena brain.",
      steps: [
        { type: "read", html: `<p class="big">A robot's brain can be a list of rules: <b>IF</b> something is true, <b>THEN</b> do something.</p>
          <p>A robot vacuum might have rules like these:</p>
          <ul><li><b>IF</b> the bumper is pressed <b>THEN</b> turn around</li><li><b>IF</b> the cliff sensor sees a drop <b>THEN</b> back up</li><li><b>IF</b> the battery is low <b>THEN</b> drive to the charger</li></ul>
          <p>The <b>IF</b> part checks a sensor: that's <b>Sense</b>. Picking which rule to follow is <b>Think</b>. The <b>THEN</b> part runs the motors: that's <b>Act</b>.</p>` },
        { type: "read", html: `<h3>Order matters</h3>
          <p>Our vacuum checks its rules from the top, every turn. The <b>first</b> rule that's true wins, and it skips the rest. Look what happens when the same two rules swap places:</p>
          <div class="rulecmp">
            <div class="rlist ok"><b>Turns at walls ✓</b><ol><li>IF a wall is ahead THEN turn right</li><li>IF always THEN drive forward</li></ol></div>
            <div class="rlist no"><b>Bumps forever ✗</b><ol><li>IF always THEN drive forward</li><li class="dead">IF a wall is ahead THEN turn right</li></ol><p class="small">"IF always" is true every turn, so rule 2 never gets a chance.</p></div>
          </div>
          <p>Put the special cases first and the "always" rule last.</p>` },
        { type: "interactive", kind: "rulebot" },
        { type: "read", html: `<h3>Program your Bot Arena robot</h3>
          <p>Pick the <b>Custom</b> brain in Bot Arena and you write its rules, up to 3. Every turn it checks them from the top, just like the vacuum:</p>
          <ul><li><b>IF</b> the enemy's shield is up <b>THEN</b> power attack</li><li><b>IF</b> my hit chance is below 40% <b>THEN</b> aim first</li><li><b>IF</b> my health is below 50 <b>THEN</b> shield</li></ul>
          <p>If no rule fits, it attacks. The battle log shows which rule ran each turn, so you can watch your program work.</p>
          <p>Ready to test your rules? The <b>Brain Challenges</b> in Practice Mode have five boss robots, and each one needs a different idea.</p>` },
        { type: "quiz", q: "A vacuum's rules are: 1. IF stairs are ahead THEN turn right. 2. IF always THEN drive forward. Stairs are ahead. What does it do?", options: ["Drives forward", "Turns right", "Both", "Nothing"], answer: 1, explain: "Rule 1 is true, so it turns right and skips rule 2. Only one rule runs each turn." },
        { type: "quiz", q: "Which list of rules has a mistake?", options: ["1. IF a wall is ahead THEN turn right. 2. IF always THEN drive forward.", "1. IF always THEN drive forward. 2. IF a wall is ahead THEN turn right."], answer: 1, explain: "IF always is true every turn, so in the second list the wall rule never runs." },
        { type: "quiz", q: "Your Bot Arena rules are: 1. IF my hit chance is below 40% THEN aim first. 2. IF always THEN power attack. This turn your hit chance is 82%. What does your robot do?", options: ["Aim first", "Power attack", "Shield", "Nothing"], answer: 1, explain: "82% isn't below 40%, so rule 1 is skipped. Rule 2 is always true, so it power attacks." },
        { type: "quiz", q: "In a rule, which part is the robot's Sense step?", options: ["The IF part", "The THEN part", "The rule's number"], answer: 0, explain: "The IF part checks what the robot senses. Picking the rule is Think, and the THEN part is Act." },
      ],
      next: { label: "Try the Brain Challenges", href: "bot-arena-offline.html#challenges" },
    },
    {
      id: "dcmotor", n: "DC motors and gears", about: "Why robots need gearboxes: trading speed for strength.",
      steps: [
        { type: "read", html: `<p class="big">A DC motor spins whenever electricity flows through it.</p>
          <svg class="part" viewBox="0 0 360 150" role="img" aria-label="A small hobby DC motor: a silver can with a metal shaft sticking out of one end and a red and a black wire on the other end.">
            <path d="M24 62 C12 62 8 70 6 86" fill="none" stroke-width="4" stroke-linecap="round" stroke="#ff5d5d"/>
            <path d="M24 90 C12 90 8 98 6 114" fill="none" stroke-width="4" stroke-linecap="round" stroke="#6d6a75"/>
            <rect x="24" y="44" width="200" height="64" rx="14" fill="#cfd2d8" stroke="#141316" stroke-width="3"/>
            <rect x="40" y="52" width="150" height="10" rx="5" fill="#eef0f3"/>
            <rect x="224" y="62" width="22" height="28" rx="4" fill="#8f8b98" stroke="#141316" stroke-width="3"/>
            <rect x="246" y="72" width="70" height="8" rx="3" fill="#8f8b98" stroke="#141316" stroke-width="2"/>
            <g font-family="JetBrains Mono, monospace" font-size="13" fill="#f4f1ea"><text x="246" y="112">shaft spins</text><text x="4" y="138">+ and − wires</text><text x="54" y="30">coil and magnets inside</text></g>
          </svg>
          <p>Inside, a coil of wire becomes a magnet when current flows through it. Magnets around the coil push and pull it, so it spins. Little metal brushes keep switching the current so it keeps turning.</p>
          <ul><li><b>More volts:</b> it spins faster.</li><li><b>Swap the two wires:</b> it spins the other way.</li></ul>` },
        { type: "read", html: `<h3>Fast but weak</h3>
          <p>A small motor spins thousands of times a minute (<b>rpm</b> means turns per minute). But its <b>torque</b>, its twisting strength, is tiny. Hook it straight to a wheel and a robot can't even climb a small ramp.</p>
          <p>A <b>gearbox</b> fixes that. A small gear on the motor turns a bigger gear on the wheel. With a <b>20:1</b> gearbox, the motor turns 20 times for every 1 turn of the wheel, so the wheel:</p>
          <ul><li>turns <b>20 times slower</b></li><li>pushes about <b>20 times harder</b> (a little less, because gears rub)</li></ul>
          <p class="small">Big ratios like 50:1 use several pairs of gears in a row.</p>` },
        { type: "interactive", kind: "dcsim" },
        { type: "read", html: `<h3>When a motor stalls</h3>
          <p>If the load is too heavy, the motor stops turning. That's called a <b>stall</b>. A stalled motor pulls the most electricity it can, and all that energy turns into heat. Leave it stalled and it can burn out.</p>
          <p>So engineers pick the gear ratio carefully: enough torque that it never stalls, but not so much gearing that the robot crawls.</p>` },
        { type: "quiz", q: "A motor spins at 6,000 rpm. It drives a wheel through a 20:1 gearbox. About how fast does the wheel turn?", options: ["120,000 rpm", "6,000 rpm", "300 rpm", "20 rpm"], answer: 2, explain: "The motor turns 20 times for each turn of the wheel: 6,000 ÷ 20 = 300 rpm." },
        { type: "quiz", q: "Your robot stalls halfway up a steep ramp. What's the best fix?", options: ["Use more gearing, like 50:1 instead of 5:1", "Use less gearing, like 1:1", "Make the robot heavier", "Paint it a faster color"], answer: 0, explain: "More gearing gives the wheels more torque, so the robot can climb. It goes slower, but it gets there." },
        { type: "quiz", q: "What does a gearbox trade?", options: ["Speed for strength (torque)", "Weight for color", "Batteries for wires", "Nothing. It just makes noise."], answer: 0, explain: "The wheel turns slower but pushes harder. That's the trade-off." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "servo", n: "Servo motors", about: "Motors that move to an exact angle, like the joints of a robot arm.",
      steps: [
        { type: "read", html: `<p class="big">A servo moves to an angle you choose, then holds it there.</p>
          <svg class="part" viewBox="0 0 360 160" role="img" aria-label="Inside a servo: a small motor, gears, a position sensor and a control chip, with three wires coming out.">
            <rect x="20" y="40" width="250" height="96" rx="12" fill="#2468b3" stroke="#141316" stroke-width="3"/>
            <rect x="110" y="16" width="70" height="24" rx="6" fill="#2468b3" stroke="#141316" stroke-width="3"/>
            <rect x="128" y="6" width="90" height="14" rx="7" fill="#f4f1ea" stroke="#141316" stroke-width="3"/>
            <g fill="#173f6b" stroke="#141316" stroke-width="2"><rect x="32" y="52" width="104" height="36" rx="6"/><rect x="146" y="52" width="112" height="36" rx="6"/><rect x="32" y="94" width="104" height="32" rx="6"/><rect x="146" y="94" width="112" height="32" rx="6"/></g>
            <g font-family="JetBrains Mono, monospace" font-size="13" fill="#f4f1ea" text-anchor="middle"><text x="84" y="75">motor</text><text x="202" y="75">gears</text><text x="84" y="115">sensor</text><text x="202" y="115">chip</text></g>
            <g stroke-width="4" fill="none" stroke-linecap="round"><path d="M270 100 C300 100 310 110 340 112" stroke="#ff5d5d"/><path d="M270 108 C300 108 310 118 340 122" stroke="#141316"/><path d="M270 116 C300 116 310 126 340 132" stroke="#ffd23f"/></g>
            <text x="300" y="152" font-family="JetBrains Mono, monospace" font-size="12" fill="#aaa6b0" text-anchor="middle">3 wires</text>
          </svg>
          <p>Inside the little box: a small DC motor, gears to make it strong, a <b>position sensor</b> that measures the angle, and a <b>control chip</b>.</p>
          <p>That makes a servo a tiny robot of its own. The sensor <b>Senses</b> the angle, the chip <b>Thinks</b> about how far off it is, and the motor <b>Acts</b> to fix it. The joints of our robot arm are servos.</p>` },
        { type: "read", html: `<h3>Talking to a servo</h3>
          <p>The robot's computer sends the servo a short pulse of electricity every <b>20 milliseconds</b> (50 times a second). How long each pulse lasts tells the servo where to point:</p>
          <ul><li><b>1.0 ms</b> pulse: one end (0°)</li><li><b>1.5 ms</b> pulse: the middle (90°)</li><li><b>2.0 ms</b> pulse: the other end (180°)</li></ul>
          <p class="small">These are typical numbers, and each servo model is a little different. Changing the length of a pulse like this is called <b>PWM</b>, pulse width modulation.</p>` },
        { type: "interactive", kind: "servosim" },
        { type: "read", html: `<h3>It checks itself</h3>
          <p>A servo never stops checking. If something pushes the arm, the sensor notices the angle changed, and the motor pushes back until it's on target again. Checking and correcting like this is called <b>feedback</b>, or a <b>closed loop</b>.</p>
          <p>Some servos are built to spin all the way around instead. On those <b>continuous rotation</b> servos, the pulse sets the speed and direction instead of the angle.</p>` },
        { type: "quiz", q: "A servo gets a 1.5 ms pulse. Where does it point?", options: ["One end (0°)", "The middle (90°)", "The other end (180°)", "It spins forever"], answer: 1, explain: "1.5 ms is halfway between 1.0 ms and 2.0 ms, so the servo points to the middle." },
        { type: "quiz", q: "Which part inside a servo lets it know its own angle?", options: ["The gears", "The position sensor", "The wires", "The plastic case"], answer: 1, explain: "The position sensor measures the angle, so the chip knows how far the motor still has to turn." },
        { type: "quiz", q: "You push a servo's arm while it's holding 90°. What happens?", options: ["It stays wherever you push it", "It pushes back to 90°", "It turns off", "It jumps to 180°"], answer: 1, explain: "That's feedback: the sensor sees the angle changed, and the motor fixes it." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "stepper", n: "Stepper motors", about: "Motors that move in tiny exact steps, like the ones in 3D printers.",
      steps: [
        { type: "read", html: `<p class="big">A stepper motor turns in tiny, exact steps.</p>
          <p>Around the middle are coils of wire. The controller turns them on one after another, and each switch pulls the magnet in the middle around by one step.</p>
          <p>Most steppers take <b>200 steps</b> to go all the way around. That's <b>1.8°</b> per step. Need a quarter turn? Send 50 steps.</p>
          <p>3D printers, laser cutters and CNC machines use steppers to move to exact spots.</p>` },
        { type: "read", html: `<h3>Counting without looking</h3>
          <p>A stepper has no sensor. The controller counts the steps it sends and assumes the motor followed. That's called an <b>open loop</b>.</p>
          <p>If the load is too heavy or the steps come too fast, the motor can't keep up and <b>skips steps</b>. The controller still thinks it's in the right place, but it isn't.</p>
          <p>When it's stopped, a stepper holds its position strongly. That's called <b>holding torque</b>.</p>` },
        { type: "interactive", kind: "stepsim" },
        { type: "read", html: `<h3>How a 3D printer stays on track</h3>
          <p>Before every print, a 3D printer <b>homes</b>: it moves each motor until a part taps a small switch at the edge. That switch is a touch sensor, and it tells the printer exactly where zero is. Then it counts steps from there.</p>
          <p>If a print suddenly looks shifted halfway up, the motors probably skipped steps.</p>` },
        { type: "quiz", q: "A stepper takes 200 steps per turn. How many steps make a quarter turn?", options: ["25", "50", "100", "200"], answer: 1, explain: "A quarter of 200 is 50, and 50 × 1.8° = 90°." },
        { type: "quiz", q: "Why can a stepper end up in the wrong place without knowing?", options: ["It has no sensor, so skipped steps go unnoticed", "Its wires are too short", "It can only turn left", "It runs out of steps"], answer: 0, explain: "The controller only counts the steps it sent. If the motor skips some, nothing tells it." },
        { type: "quiz", q: "Which machine is famous for using stepper motors?", options: ["A ceiling fan", "A 3D printer", "A drone", "A blender"], answer: 1, explain: "3D printers move the nozzle to exact spots by counting steps." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "motorpick", n: "Pick the right motor", about: "DC, servo, stepper or brushless: match each job to the best motor.",
      steps: [
        { type: "read", html: `<p class="big">Every motor is good at a different job.</p>
          <table class="rtab"><thead><tr><th>Motor</th><th>Best at</th><th>Used in</th></tr></thead><tbody>
          <tr><td><b>DC gearmotor</b><small>DC motor + gearbox</small></td><td>spinning nonstop, simple speed control</td><td>robot car wheels, toys</td></tr>
          <tr><td><b>Servo</b><small>motor + sensor + chip</small></td><td>moving to an exact angle and holding it</td><td>robot arm joints, steering, grippers</td></tr>
          <tr><td><b>Stepper</b><small>coils switched in order</small></td><td>exact steps without a sensor</td><td>3D printers, CNC machines</td></tr>
          <tr><td><b>Brushless</b><small>needs a speed controller</small></td><td>very fast, powerful and efficient</td><td>drones, e-bikes, many electric cars</td></tr>
          </tbody></table>
          <p><b>Brushless</b> motors have no brushes rubbing inside. A small computer called an <b>ESC</b> (electronic speed controller) switches the coils instead, so they last longer and waste less energy.</p>` },
        { type: "interactive", kind: "motormatch" },
        { type: "read", html: `<h3>Real robots use a team of motors</h3>
          <ul><li><b>Robot vacuum:</b> DC gearmotors drive its wheels, and another motor spins its brushes.</li>
          <li><b>Our robot arm:</b> servos at the joints, so each one moves to an exact angle.</li>
          <li><b>3D printer:</b> steppers move the nozzle, and small fans cool the plastic.</li></ul>` },
        { type: "quiz", q: "A drone needs motors that spin its propellers super fast without wasting battery. Which kind?", options: ["Servo", "Stepper", "Brushless", "No motor"], answer: 2, explain: "Brushless motors are fast, powerful and efficient. That's why almost every drone uses them." },
        { type: "quiz", q: "In Bot Arena, what kind of motor would move each joint of a robot's Legs?", options: ["Servos", "One big fan motor", "A brushless drone motor", "No motor at all"], answer: 0, explain: "Walking robots move each leg joint to an exact angle, which is a servo's job." },
        { type: "quiz", q: "Which motor would you pick to drive a robot car's wheels?", options: ["A DC gearmotor", "A stepper with no controller", "A servo stuck at 90°", "A brushless motor with no speed controller"], answer: 0, explain: "A DC gearmotor spins nonstop with plenty of torque, which is just what wheels need." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "links", n: "Links and joints", about: "How a robot arm is built, how far it can reach, and how it works out its angles.",
      steps: [
        { type: "read", html: `<p class="big">A robot arm is a chain of links and joints.</p>
          <svg class="part" viewBox="0 0 360 190" role="img" aria-label="A two-link robot arm on a base. Labels point to the base, the shoulder joint, link 1, the elbow joint, link 2 and the gripper.">
            <rect x="34" y="150" width="72" height="28" rx="6" fill="#55535c" stroke="#141316" stroke-width="3"/>
            <g stroke-linecap="round"><line x1="70" y1="150" x2="182" y2="72" stroke="#141316" stroke-width="20"/><line x1="70" y1="150" x2="182" y2="72" stroke="#f46524" stroke-width="13"/>
            <line x1="182" y1="72" x2="282" y2="112" stroke="#141316" stroke-width="17"/><line x1="182" y1="72" x2="282" y2="112" stroke="#ff8a50" stroke-width="10"/></g>
            <g stroke="#141316" stroke-width="3" stroke-linecap="round"><line x1="282" y1="112" x2="300" y2="100"/><line x1="282" y1="112" x2="296" y2="124"/></g>
            <g fill="#2b2a30" stroke="#141316" stroke-width="3"><circle cx="70" cy="150" r="11"/><circle cx="182" cy="72" r="10"/></g>
            <g fill="#c9c5d1"><circle cx="70" cy="150" r="4"/><circle cx="182" cy="72" r="4"/></g>
            <g font-family="JetBrains Mono, monospace" font-size="13" fill="#f4f1ea"><text x="112" y="168">shoulder</text><text x="40" y="188">base</text><text x="88" y="100">link 1</text><text x="160" y="44">elbow</text><text x="214" y="80">link 2</text><text x="296" y="140">gripper</text></g>
          </svg>
          <p><b>Links</b> are the stiff parts, like the bones in your arm. <b>Joints</b> are where links connect and move, like your shoulder and elbow.</p>
          <ul><li><b>Turning joints</b> (engineers say <i>revolute</i>) rotate like a door hinge. A servo usually drives each one.</li>
          <li><b>Sliding joints</b> (<i>prismatic</i>) move in a straight line, like a drawer.</li></ul>` },
        { type: "read", html: `<h3>Degrees of freedom</h3>
          <p>Each joint that can move on its own adds one <b>degree of freedom</b>. Two joints let an arm reach spots on a flat surface. To reach any spot in 3D <i>and</i> point its gripper in any direction, an arm needs six.</p>
          <p>Your own arm has about seven, so you can keep your hand flat on a table and still move your elbow.</p>
          <p>The simulator next has two links: an 18 cm upper arm and a 14 cm forearm.</p>` },
        { type: "interactive", kind: "armsim" },
        { type: "read", html: `<h3>Working backwards</h3>
          <p>In the simulator you picked joint angles and watched where the hand went. That's <b>forward kinematics</b>.</p>
          <p>Robots usually need the opposite: "The block is here. What angles do I need?" That's <b>inverse kinematics</b>, and the robot's computer solves it with trigonometry.</p>
          <p>Most spots can be reached two ways, elbow up or elbow down, like reaching for a cup with your elbow high or low.</p>
          <p>And no arm reaches farther than its links laid end to end. Here that's 18 + 14 = <b>32 cm</b>.</p>` },
        { type: "quiz", q: "A robot arm has an 18 cm link and a 14 cm link. What's the farthest its hand can reach from the shoulder?", options: ["14 cm", "18 cm", "32 cm", "252 cm"], answer: 2, explain: "Laid out straight, the links add up: 18 + 14 = 32 cm. Anything farther is out of reach." },
        { type: "quiz", q: "Which kind of joint moves in a straight line instead of turning?", options: ["A turning (revolute) joint", "A sliding (prismatic) joint", "A link", "A gripper"], answer: 1, explain: "A sliding joint moves in a line, like a drawer. A turning joint rotates, like a hinge." },
        { type: "quiz", q: "A robot knows where a block is and works out the joint angles to reach it. What's that called?", options: ["Forward kinematics", "Inverse kinematics", "Degrees of freedom", "Holding torque"], answer: 1, explain: "Working backwards from a target to the angles is inverse kinematics." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "armtorque", n: "Arm strength: levers and torque", about: "Why a weight far out is harder to hold, and how servo strength is measured.",
      steps: [
        { type: "read", html: `<p class="big">The farther out a weight is, the harder a joint has to work.</p>
          <p>Try it: hold a full water bottle close to your chest, then straight out at arm's length. Same bottle, but it feels much heavier far away.</p>
          <p>That twisting effort is <b>torque</b>. It depends on the weight and on how far out it is <b>sideways</b> from the joint:</p>
          <p class="formula">torque = weight × sideways distance</p>
          <p>Hobby servos print their strength in <b>kg·cm</b>. A <b>2 kg·cm</b> servo can hold 2 kg at 1 cm, 200 g at 10 cm, or just 100 g at 20 cm.</p>` },
        { type: "interactive", kind: "torquesim" },
        { type: "read", html: `<h3>Why the shoulder works hardest</h3>
          <p>The shoulder holds up everything past it: both links, the elbow servo, the gripper and whatever it's carrying. The elbow only holds what's past the elbow.</p>
          <p>So engineers put the strongest servo at the shoulder, keep links light (aluminum or carbon fiber), and pick things up close to the base when they can. Big machines like cranes add a <b>counterweight</b> on the other side.</p>` },
        { type: "quiz", q: "A servo is rated 2 kg·cm. Ignoring the arm's own weight, how heavy a block can it hold 10 cm from the joint?", options: ["20 g", "200 g", "2 kg", "20 kg"], answer: 1, explain: "2 kg·cm ÷ 10 cm = 0.2 kg, which is 200 g." },
        { type: "quiz", q: "Your arm's servo can't hold a block straight out. Which change helps?", options: ["Use a longer arm", "Hold the block closer to the joint, or raise the arm so it's not as far out sideways", "Use a heavier gripper", "Point the camera at it"], answer: 1, explain: "Torque depends on the sideways distance. Closer or higher means less torque." },
        { type: "quiz", q: "In a robot arm, which joint usually needs the strongest servo?", options: ["The gripper", "The wrist", "The shoulder, closest to the base", "They all need the same"], answer: 2, explain: "The shoulder holds up the whole arm plus the load, so it needs the most torque." },
      ],
      next: { label: "Build a robot in practice mode", href: "bot-arena-offline.html" },
    },
    {
      id: "tradeoffs", n: "Weight and trade-offs", about: "Why engineers can't have everything, and how a weight limit forces choices.",
      steps: [
        { type: "read", html: `<p class="big">Engineers can't have everything. Every choice gives something and costs something.</p>
          <p>That's called a <b>trade-off</b>. In Bot Arena, every part has a weight, and the motors can only carry <b>75 kg</b>.</p>
          <p>Heavy parts like Treads and the Hammer are strong. But you can't put every strong part on one robot.</p>` },
        { type: "interactive", kind: "budget" },
        { type: "quiz", q: "Treads (40 kg) + Camera (10 kg) + Hammer (30 kg) = 80 kg. That's too heavy. Which change does NOT fix it?", options: ["Swap the Camera for Touch (2 kg)", "Swap the Hammer for a Spinner (20 kg)", "Swap the Aggressive brain for the Smart brain", "Swap the Treads for Legs (30 kg)"], answer: 2, explain: "Brains weigh 0 kg, so swapping brains doesn't change the weight. All the other swaps get under 75 kg." },
        { type: "quiz", q: "What is a trade-off?", options: ["A part that is always the best", "Getting more of one thing by giving up some of another", "Trading robots with a friend"], answer: 1, explain: "Like Treads: more armor, but slower and heavier. Every part in the game is a trade-off." },
      ],
      next: { label: "Build a robot under 75 kg", href: "bot-arena-offline.html" },
    },
    {
      id: "thrust", n: "Thrust vs. weight", about: "How a car can fly: Newton's 3rd Law and the thrust-to-weight ratio.",
      steps: [
        { type: "read", html: `<p class="big">To fly, push air down hard enough that the air pushes you up.</p>
          <p>That's <b>Newton's 3rd Law</b>: every push has an equal push back. Let go of a blown-up balloon and it shoots away as the air rushes out.</p>
          <p>The flying car shown in October 2026 used <b>compressed-air thrusters</b>: tanks of squeezed air blasting out of nozzles.</p>` },
        { type: "read", html: `<h3>Thrust-to-weight</h3>
          <p><b>Weight</b> is how hard gravity pulls: mass × 9.8. A 1,000 kg car weighs about 9.8 kN (kilonewtons).</p>
          <p><b>Thrust-to-weight = thrust ÷ weight.</b></p>
          <ul><li>Above 1.0: the thrusters can lift the car by themselves.</li><li>Below 1.0: they can only slow its fall.</li></ul>` },
        { type: "interactive", kind: "thrust" },
        { type: "quiz", q: "A car weighs 12 kN. Its nozzles push with 9 kN. Can the thrusters lift it by themselves?", options: ["Yes", "No"], answer: 1, explain: "9 ÷ 12 = 0.75. That's below 1.0, so gravity wins." },
        { type: "quiz", q: "Which change raises thrust-to-weight?", options: ["Add two passengers", "Switch from a steel body to carbon fiber", "Remove some nozzles", "Add heavy armor"], answer: 1, explain: "Carbon fiber is much lighter than steel. Same thrust, less weight, so the ratio goes up." },
      ],
      next: { label: "Try Mission 1 in the Flying Car Lab", href: "flying-car-lab-offline.html" },
    },
    {
      id: "landing", n: "Higher isn't always better", about: "Why flying too high makes a crash landing, and the math behind it.",
      steps: [
        { type: "read", html: `<p class="big">The higher something falls, the faster it hits the ground.</p>
          <p>Speed when it lands ≈ <b>√(2 × 9.8 × height)</b>.</p>
          <p>It isn't simple doubling. Falling from <b>4 times</b> as high makes it hit only <b>2 times</b> as fast. But that's still a lot harder.</p>` },
        { type: "interactive", kind: "falling" },
        { type: "quiz", q: "To clear a 4 m semi truck you need about 5 m of height. Your car flew to 13 m and crashed when it landed. What's the best fix?", options: ["Add more nozzles", "Add more air tanks", "Use less thrust so it flies lower", "Go faster up the ramp"], answer: 2, explain: "You only needed 5 m. Flying lower means hitting the ground slower. Engineers use just enough power, not the most." },
        { type: "quiz", q: "If you drop something from 4 times as high, it hits the ground about...", options: ["the same speed", "2 times as fast", "4 times as fast", "16 times as fast"], answer: 1, explain: "Speed grows with the square root of height. √4 = 2." },
      ],
      next: { label: "Try the Semi Jump in the Lab", href: "flying-car-lab-offline.html" },
    },
    {
      id: "engineer", n: "Think like an engineer", about: "Predict, test, explain, improve. And why you change one thing at a time.",
      steps: [
        { type: "read", html: `<p class="big">Engineers don't guess. They follow a cycle.</p>
          <ol style="margin:0;padding-left:22px;display:grid;gap:6px;font-size:18px"><li><b>Predict:</b> "If I change this, I think that will happen, because..."</li>
          <li><b>Test:</b> try it.</li><li><b>Explain:</b> why did it happen? (The flight report helps.)</li><li><b>Improve:</b> change something and test again.</li></ol>` },
        { type: "read", html: `<h3>The fair test rule</h3>
          <p>Change only <b>one thing</b> at a time. If you change two things and the result changes, you can't tell which one caused it.</p>` },
        { type: "quiz", q: "Maya changed her car's body to carbon fiber AND added 4 nozzles. It flew higher. Which change made it fly higher?", options: ["The carbon fiber", "The nozzles", "We can't tell, because she changed two things"], answer: 2, explain: "Both changes could raise the height. To know for sure, change one at a time." },
        { type: "quiz", q: "Leo's car crashed. What should he do first?", options: ["Change everything", "Read the flight report to find out why", "Give up", "Pick random parts"], answer: 1, explain: "The report tells you what went wrong, so your next change has a reason." },
        { type: "quiz", q: "Which is the best prediction?", options: ["It will be cool.", "If I add 2 lift nozzles, the car will fly higher, because thrust goes up.", "I don't know.", "My car will win."], answer: 1, explain: "A good prediction says what will change, and why." },
      ],
      next: { label: "Use the cycle in the Flying Car Lab", href: "flying-car-lab-offline.html" },
    },
  ];

  // ---------------- list ----------------
  function renderList() {
    const el = $("lessons"); el.innerHTML = "";
    let done = 0;
    LESSONS.forEach((L, i) => {
      const p = progress[L.id]; if (p && p.done) done++;
      const b = document.createElement("button"); b.type = "button"; b.className = "lcard" + (p && p.done ? " done" : "");
      b.innerHTML = `<span class="num">LESSON ${i + 1}</span><h2></h2><p></p><span class="meta"><span>About 5 min</span>${p && p.done ? `<span class="badge">Done ✓ ${p.score}/${p.total}</span>` : ""}</span>`;
      b.querySelector("h2").textContent = L.n; b.querySelector("p").textContent = L.about;
      b.onclick = () => openLesson(i);
      el.appendChild(b);
    });
    $("pbar").style.width = (done / LESSONS.length) * 100 + "%";
    $("ptext").textContent = `${done} of ${LESSONS.length} lessons done`;
  }

  // ---------------- lesson view ----------------
  let cur = null; // { i, step, score, answered:{}, doneSteps:Set }
  function openLesson(i) {
    cur = { i, step: 0, score: 0, total: LESSONS[i].steps.filter((s) => s.type === "quiz").length, answered: {}, ok: {} };
    $("v-list").hidden = true; $("v-lesson").hidden = false;
    try { history.replaceState(null, "", "#lesson-" + (i + 1)); } catch {}
    if (window.Presence) Presence.where(i + 1);
    renderStep(); window.scrollTo(0, 0);
  }
  function closeLesson() {
    cur = null; $("v-list").hidden = false; $("v-lesson").hidden = true;
    try { history.replaceState(null, "", location.pathname); } catch {}
    if (window.Presence) Presence.where(0);

        ctx.fillStyle = "#2b2a30"; ctx.fillRect(0, oy, w, h - oy); ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(0, oy, w, 1.5); // table
        const fs = Math.max(10, Math.round(sc * 1.6));
        AR.BLOCKS.forEach((b) => { // blocks on stands
          const [bx, by] = P(b.x, b.y), [, base] = P(b.x, 0), half = 2 * sc;
          ctx.fillStyle = "#3a3842"; ctx.fillRect(bx - sc * 0.4, by + half, sc * 0.8, base - by - half);
          ctx.fillStyle = b.color; ctx.strokeStyle = "#141316"; ctx.lineWidth = 2; E.rr(ctx, bx - half, by - half, half * 2, half * 2, 3); ctx.fill(); ctx.stroke();
        });
        if (st.done.red) { const [bx, by] = P(B.red.x, B.red.y); ctx.font = `700 ${fs}px "JetBrains Mono", monospace`; ctx.fillStyle = "#ff8a8a"; ctx.textAlign = "center"; ctx.fillText(`${redDist.toFixed(1)} cm away`, bx, by - 3 * sc); }
        const [sx, sy] = P(0, 0), [ex, ey] = P(elbow.x, elbow.y), [hx, hy] = P(hand.x, hand.y);
        ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke(); ctx.setLineDash([]); // shoulder-to-hand distance
        ctx.fillStyle = "#55535c"; ctx.strokeStyle = "#141316"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, 3.2 * sc, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); // base
        ctx.strokeStyle = "rgba(255,210,63,.55)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, 5 * sc, 0, -(st.s * Math.PI) / 180, true); ctx.stroke(); // shoulder angle
        const link = (x1, y1, x2, y2, wdt, col) => { ctx.lineCap = "round"; ctx.strokeStyle = "#141316"; ctx.lineWidth = wdt + 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.lineCap = "butt"; };
        link(sx, sy, ex, ey, 2 * sc, "#f46524"); link(ex, ey, hx, hy, 1.5 * sc, "#ff8a50");
        const ga = ((st.s + st.e) * Math.PI) / 180; // gripper fingers along the forearm
        ctx.strokeStyle = "#141316"; ctx.lineWidth = Math.max(3, sc * 0.6); ctx.lineCap = "round";
        [-0.6, 0.6].forEach((o) => { ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(ga + o) * 2 * sc, hy - Math.sin(ga + o) * 2 * sc); ctx.stroke(); });
        ctx.lineCap = "butt";
        [[sx, sy, 1.7], [ex, ey, 1.4]].forEach(([x, y, r]) => { ctx.fillStyle = "#2b2a30"; ctx.strokeStyle = "#141316"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * sc, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#c9c5d1"; ctx.beginPath(); ctx.arc(x, y, r * sc * 0.4, 0, 7); ctx.fill(); });
        ctx.font = `700 ${fs}px "JetBrains Mono", monospace`; ctx.fillStyle = "#ffd23f"; ctx.textAlign = "left";
        ctx.fillText(`${Math.round(st.s)}°`, sx + 5.5 * sc, sy - 1.2 * sc);
        if (st.byComputer) { ctx.fillStyle = "#38a7f0"; ctx.textAlign = "center"; ctx.fillText("computer is driving", w / 2, fs + 6); }
        ctx.textAlign = "left";
      };
      sliders(); tasks(); setNext(!!cur.ok[key]);
      animate(cv, draw);
    },

    torquesim(card) {
      const AR = window.Arm, key = cur.step;
      const TASKS = [["fail", "Make the small servo give up"], ["strong", "Hold 200 g on the 30 cm arm"], ["smart", "Hold 200 g on the 30 cm arm with the small servo"]];
      const st = { w: 1, L: 1, sv: 0, ang: 0, run: null, done: {}, last: 0, puff: 0 };
      const fx = new E.FX();
      card.innerHTML = `<h3>Arm strength simulator</h3><p>Pick a block, an arm length and a servo, set the arm's angle, then press <b>Hold</b>. Can the shoulder servo hold it up?</p>
        <div class="sim tall"><canvas aria-label="Side view: a servo holds an arm with a block at the end. A line shows how far out the block is sideways."></canvas></div>
        <div class="lbl">Block</div><div class="chips" id="t-w"></div>
        <div class="lbl">Arm length</div><div class="chips" id="t-l"></div>
        <div class="lbl">Shoulder servo</div><div class="chips" id="t-sv"></div>
        <div class="slider" data-tip="How far above level the arm points. 0° is straight out sideways, 90° is straight up."><div class="row"><span>Arm angle</span><b id="t-av"></b></div><input type="range" id="t-ang" min="0" max="90" step="5" aria-label="Arm angle in degrees"></div>
        <div class="tq" tabindex="0" data-tip="The bar is how much torque the servo can give. The white line is how much it takes to hold this block here. Past the line, it holds. Short of it, it gives up.">
          <div class="row"><span>Torque needed (block + arm)</span><b id="t-need">-</b></div><div class="row"><span>Servo can give</span><b id="t-have">-</b></div>
          <div class="tqbar"><i id="t-havebar"></i><span id="t-needmark"></span></div></div>
        <div class="simrow"><div class="readout simout" style="flex:1"><div tabindex="0" data-tip="How far the block is from the joint, sideways. Only this distance counts for torque."><b id="t-d">-</b>sideways distance</div></div><button class="btn" id="t-hold" type="button" data-tip="Ask the servo to hold the arm at this angle.">Hold</button></div>
        <div class="lbl">Experiments</div><ul class="tasks" id="t-tasks"></ul><div class="fb"></div>`;
      const q = (sel) => card.querySelector(sel), cv = q("canvas");
      const cfg = () => { const kg = AR.WEIGHTS[st.w], L = AR.LENGTHS[st.L], sv = AR.SERVOS[st.sv]; return { kg, L, sv, d: L * Math.cos((st.ang * Math.PI) / 180), need: AR.holdTorque(kg, L, st.ang), have: sv.kgcm }; };
      const tasks = () => { q("#t-tasks").innerHTML = TASKS.map(([k, t]) => `<li${st.done[k] ? ' class="done"' : ""}>${t}</li>`).join(""); };
      const meter = () => { // live, so students can see the numbers change as they explore
        const c = cfg(), mx = Math.max(c.need, c.have) * 1.15;
        q("#t-need").textContent = c.need.toFixed(2) + " kg·cm"; q("#t-have").textContent = c.have + " kg·cm"; q("#t-d").textContent = c.d.toFixed(1) + " cm";
        q("#t-havebar").style.width = (c.have / mx) * 100 + "%"; q("#t-havebar").className = c.need > c.have ? "bad" : ""; q("#t-needmark").style.left = (c.need / mx) * 100 + "%";
        q("#t-av").textContent = st.ang + "°";
      };
      const rows = () => {
        chipRow(q("#t-w"), AR.WEIGHTS.map((k) => k * 1000 + " g"), AR.WEIGHTS.map((k) => `A ${k * 1000} g block in the gripper.`), st.w, (i) => { st.w = i; reset(); });
        chipRow(q("#t-l"), AR.LENGTHS.map((l) => l + " cm"), AR.LENGTHS.map((l) => `A ${l} cm arm from the shoulder to the gripper.`), st.L, (i) => { st.L = i; reset(); });
        chipRow(q("#t-sv"), AR.SERVOS.map((s) => `${s.n}: ${s.kgcm} kg·cm`), ["A small hobby servo, rated about 2 kg·cm.", "A standard-size hobby servo, rated about 10 kg·cm."], st.sv, (i) => { st.sv = i; reset(); });
      };
      const reset = () => { st.run = null; rows(); meter(); };
      q("#t-ang").addEventListener("input", (e) => { st.ang = +e.target.value; st.run = null; meter(); });
      q("#t-hold").onclick = () => {
        const c = cfg(); st.run = { t0: performance.now(), ...c, ok: c.need <= c.have, ang: st.ang, fin: false };
        q(".fb").innerHTML = ""; E.Sound.play("go");
      };
      const finish = (run) => {
        run.fin = true;
        if (!run.ok && run.sv.kgcm === AR.SERVOS[0].kgcm) st.done.fail = true;
        const big = run.ok && run.kg === 0.2 && run.L === 30;
        if (big) st.done.strong = true;
        if (big && run.sv.kgcm === AR.SERVOS[0].kgcm) st.done.smart = true;
        tasks();
        const all = TASKS.every(([t]) => st.done[t]);
        if (all) { cur.ok[key] = true; setNext(true); }
        const msg = run.ok
          ? `<b>Holding!</b> The block is ${run.d.toFixed(1)} cm out sideways, so it takes ${run.need.toFixed(2)} kg·cm. The servo can give ${run.have}.${big && run.sv.kgcm === AR.SERVOS[0].kgcm ? " Raising the arm made the sideways distance short enough for the small servo!" : ""}`
          : `<b>Too heavy!</b> At ${run.d.toFixed(1)} cm out sideways it takes ${run.need.toFixed(2)} kg·cm, but this servo only gives ${run.have}. Hold it closer, raise the arm, or use a stronger servo.`;
        setFb(card, run.ok || all, msg + (all ? "<br><b>All 3 done!</b> Torque is weight times sideways distance." : ""));
        E.Sound.play(run.ok ? "beep" : "miss");
      };
      const draw = (now) => {
        const dt = Math.min(0.05, (now - (st.last || now)) / 1000); st.last = now;
        const run = st.run, c = cfg(), { ctx, w, h } = E.fit(cv);
        let ang = st.ang, shake = 0;
        if (run) {
          const k = Math.min(1, (now - run.t0) / 900);
          if (!run.ok) { ang = Math.max(-40, run.ang - 55 * E.ease.out(k)); shake = run.fin ? 0 : Math.sin(now / 15) * 1.5; if ((st.puff -= dt) <= 0 && !run.fin) { st.puff = 0.2; fx.burst(w * 0.17, h * 0.5, 2, { colors: ["#6d6a75"], kind: "smoke", speed: 30, g: -60, life: 1.1, size: 6, drag: 0.95, angle: -Math.PI / 2, spread: 1 }); } }
          if (!run.fin && k >= 1) finish(run);
        }
        ctx.clearRect(0, 0, w, h);
        const gy = h * 0.92, px = w * 0.17, py = h * 0.6, ppc = Math.min((w * 0.7) / 30, (py - h * 0.05) / 30), len = c.L * ppc, a = (ang * Math.PI) / 180; // the longest arm fits pointing up or sideways
        ctx.fillStyle = "#2b2a30"; ctx.fillRect(0, gy, w, h - gy);
        ctx.fillStyle = "#3a3842"; ctx.fillRect(px - w * 0.018, py, w * 0.036, gy - py); // stand
        const failing = run && !run.ok;
        ctx.fillStyle = failing ? "#ff5d5d" : "#2468b3"; ctx.strokeStyle = "#141316"; ctx.lineWidth = 2; E.rr(ctx, px - w * 0.06 + shake, py - h * 0.07, w * 0.12, h * 0.14, 8); ctx.fill(); ctx.stroke(); // servo
        const fs = Math.max(10, Math.round(h * 0.04));
        ctx.font = `700 ${fs}px "JetBrains Mono", monospace`; ctx.fillStyle = "#f4f1ea"; ctx.textAlign = "center"; ctx.fillText(`${c.sv.kgcm} kg·cm`, px + shake, py + h * 0.07 + fs + 4);
        const tx = px + Math.cos(a) * len + shake, ty = py - Math.sin(a) * len;
        ctx.lineCap = "round"; ctx.strokeStyle = "#141316"; ctx.lineWidth = h * 0.05; ctx.beginPath(); ctx.moveTo(px + shake, py); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.strokeStyle = "#f46524"; ctx.lineWidth = h * 0.032; ctx.beginPath(); ctx.moveTo(px + shake, py); ctx.lineTo(tx, ty); ctx.stroke(); ctx.lineCap = "butt";
        ctx.fillStyle = "#f4f1ea"; ctx.strokeStyle = "#141316"; ctx.beginPath(); ctx.arc(px + shake, py, h * 0.03, 0, 7); ctx.fill(); ctx.stroke();
        const bs = h * (0.06 + c.kg * 0.25); // block hangs from the gripper; heavier blocks look bigger
        ctx.strokeStyle = "#aaa6b0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty + h * 0.05); ctx.stroke();
        ctx.fillStyle = "#8f8b98"; ctx.strokeStyle = "#141316"; E.rr(ctx, tx - bs / 2, ty + h * 0.05, bs, bs, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#141316"; ctx.font = `700 ${Math.max(9, Math.round(bs * 0.32))}px "JetBrains Mono", monospace`; ctx.fillText(`${c.kg * 1000}g`, tx, ty + h * 0.05 + bs / 2 + 4);
        // the sideways distance that counts
        const dy = gy - h * 0.05, dpx = px + c.d * ppc;
        ctx.strokeStyle = "#ffd23f"; ctx.fillStyle = "#ffd23f"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px, dy); ctx.lineTo(dpx, dy); ctx.stroke();
        [px, dpx].forEach((x) => { ctx.beginPath(); ctx.moveTo(x, dy - 6); ctx.lineTo(x, dy + 6); ctx.stroke(); });
        ctx.setLineDash([3, 4]); ctx.strokeStyle = "rgba(255,210,63,.4)"; ctx.beginPath(); ctx.moveTo(dpx, dy); ctx.lineTo(dpx, ty + h * 0.05); ctx.stroke(); ctx.setLineDash([]);
        ctx.font = `700 ${fs}px "JetBrains Mono", monospace`; ctx.fillText(`${c.d.toFixed(1)} cm sideways`, Math.max(px + 40, (px + dpx) / 2), dy - 8);
        if (run && run.fin) { ctx.font = `700 ${fs + 6}px "Chakra Petch", Arial, sans-serif`; ctx.fillStyle = run.ok ? "#4fd18b" : "#ff5d5d"; ctx.fillText(run.ok ? "HOLDING" : "TOO HEAVY", w * 0.62, h * 0.14); }
        ctx.textAlign = "left";
        fx.update(dt); fx.draw(ctx);
      };
      q("#t-ang").value = st.ang; rows(); meter(); tasks(); setNext(!!cur.ok[key]);
      animate(cv, draw);
    },
  };

  // ---------------- presenting to a class ----------------
  // /learn?present (opened from the board): this tab takes over as the game's host. Each card is sent to the game,
  // quiz cards become polls on the students' devices, and the teacher reveals the answer when the class is ready.
  const present = (() => {
    const on = /[?&]present\b/.test(location.search) && !!window.baSocket;
    const api = { on, send() {}, quiz() {} };
    if (!on) return api;
    const socket = window.baSocket;
    let saved = null, ready = false, poll = null, onPoll = null;
    try { saved = JSON.parse(sessionStorage.getItem("ba-host")); } catch {}
    document.body.classList.add("present");
    const bar = document.createElement("div"); bar.className = "presentbar";
    bar.innerHTML = '<span id="pr-msg">Connecting to your game...</span><button class="btn ghost" id="pr-back" type="button" data-tip="Stop presenting and go back to the game board. Students\' devices go back to normal.">Back to the game board</button>';
    document.querySelector(".wrap").insertBefore(bar, document.querySelector(".wrap").children[1]);
    $("pr-back").onclick = () => { if (ready) socket.emit("host:lessonEnd", {}, () => (location.href = "/host")); else location.href = "/host"; };
    if (!saved) { $("pr-msg").textContent = "No game found in this tab. Open the board (Host on the board) first, then press Present a lesson."; return api; }
    socket.on("connect", () => socket.emit("host:resume", saved, (r) => {
      if (!r || !r.ok) { ready = false; $("pr-msg").textContent = "That game has ended. Go back to the board to start a new one."; return; }
      ready = true; $("pr-msg").innerHTML = `Presenting to game <b>${esc(r.code)}</b>. Students follow along on their devices.`; api.send();
    }));
    socket.on("room:poll", (p) => { poll = p; onPoll && onPoll(p); });
    api.send = () => {
      if (!ready) return;
      if (!cur) { socket.emit("host:lessonEnd", {}); return; }
      const L = LESSONS[cur.i], s = L.steps[cur.step];
      socket.emit("host:lesson", { num: cur.i + 1, n: L.n, step: cur.step, steps: L.steps.length, quiz: s && s.type === "quiz" ? { q: s.q, options: s.options, answer: s.answer, explain: s.explain } : null });
    };
    // a quiz card on the board: live answer counts, then Reveal
    api.quiz = (s, card) => {
      const key = cur.step, id = `${cur.i + 1}-${key}`;
      card.innerHTML = `<h3>Class poll</h3><p class="big"></p><div class="choices2"></div><p class="pollmeta" aria-live="polite">Students: answer on your device!</p><div class="btnrow"><button class="btn" type="button" data-tip="Show the right answer on the board and on every device. Students who got it right earn a quiz point.">Reveal the answer</button></div><div class="fb"></div>`;
      card.querySelector(".big").textContent = s.q;
      const box = card.querySelector(".choices2"), meta = card.querySelector(".pollmeta"), reveal = card.querySelector(".btnrow .btn");
      s.options.forEach((o) => { const d = document.createElement("div"); d.className = "qopt poll"; d.innerHTML = '<span></span><div class="pbar2"><i></i></div><span class="pn">0</span>'; d.firstChild.textContent = o; box.appendChild(d); });
      const shown = (revealed, right, answered) => {
        [...box.children].forEach((d, i) => d.classList.toggle("right", revealed && i === s.answer));
        if (revealed) { reveal.disabled = true; setFb(card, true, `<b>${esc(s.options[s.answer])}</b> ${esc(s.explain)}${answered != null ? `<br>${right} of ${answered} got it right.` : ""}`); cur.ok[key] = true; setNext(true); }
      };
      onPoll = (p) => {
        if (p.id !== id || !card.isConnected) return;
        const max = Math.max(1, ...p.counts);
        [...box.children].forEach((d, i) => { d.querySelector("i").style.width = (p.counts[i] / max) * 100 + "%"; d.querySelector(".pn").textContent = `${p.counts[i]} pick${p.counts[i] === 1 ? "" : "s"}`; });
        meta.textContent = `${p.answered} of ${p.players} students answered`;
      };
      if (poll) onPoll(poll);
      reveal.onclick = () => socket.emit("host:reveal", { id }, (r) => { if (r && r.ok) { E.Sound.play("win"); shown(true, r.right, r.answered); } });
      setNext(!!cur.ok[key]);
      if (cur.ok[key]) shown(true);
    };
    return api;
  })();

  // ---------------- boot ----------------
  renderList();
  const m = (location.hash || "").match(/^#lesson-(\d+)$/);
  if (m && LESSONS[+m[1] - 1]) openLesson(+m[1] - 1);
  window.__learn = { LESSONS };
})();

</script>
</body>
</html>
