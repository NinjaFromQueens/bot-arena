<style>
/* Bot Arena — shared styles. Workshop "garage" on a blueprint floor; Fall Robotics orange. */
:root {
  color-scheme: dark;
  --bg: #1b1a1e;
  --floor: #242328;
  --panel: #2b2a30;
  --panel-hi: #33323a;
  --line: #44424b;
  --fg: #f4f1ea;
  --muted: #aaa6b0;
  --orange: #f46524;
  --orange-hi: #ff8a50;
  --orange-soft: #f4652429;
  --blue: #38a7f0;
  --blue-soft: #38a7f029;
  --purple: #c58cff;
  --gold: #ffd23f;
  --good: #4fd18b;
  --bad: #ff5d5d;
  --ink: #141316;
  --display: "Chakra Petch", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: "JetBrains Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1200px 500px at 50% -200px, #f4652418, transparent 70%),
    linear-gradient(var(--floor) 1px, transparent 1px),
    linear-gradient(90deg, var(--floor) 1px, transparent 1px);
  background-size: 100% 100%, 28px 28px, 28px 28px;
  color: var(--fg);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; }
a { color: var(--orange-hi); }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.logo { width: 46px; height: 46px; flex: none; }
.brand small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--orange); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 21px; margin: 0; line-height: 1.2; }
h3 { font-family: var(--display); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.intro { color: var(--muted); max-width: 70ch; }
.intro b { color: var(--fg); font-weight: 600; }
.panel { background: linear-gradient(180deg, var(--panel-hi), var(--panel) 120px); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.chip { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; line-height: 1.5; text-transform: uppercase; }
.c-sense { background: var(--blue-soft); color: var(--blue); }
.c-think { background: #c58cff26; color: var(--purple); }
.c-act { background: var(--orange-soft); color: var(--orange-hi); }
.c-win { background: #4fd18b26; color: var(--good); }
.c-move { background: #ffffff14; color: var(--fg); }
.btn {
  font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em;
  background: var(--orange); color: var(--ink); border: 0; border-radius: 9px; padding: 11px 18px; cursor: pointer;
  box-shadow: 0 3px 0 #a93d0c; transition: transform .08s, box-shadow .08s, filter .15s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 #a93d0c; }
.btn.ghost { background: var(--panel-hi); color: var(--fg); box-shadow: 0 3px 0 #18171b; border: 1px solid var(--line); }
.btn.big { font-size: 19px; padding: 13px 26px; }
.btn.huge { font-size: 24px; padding: 16px 30px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.small { font-size: 13px; color: var(--muted); }
.soundbtn { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.soundbtn[aria-pressed="true"] { color: var(--good); border-color: #4fd18b66; }
input[type=text] {
  font-family: var(--mono); font-size: 17px; letter-spacing: .04em;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%;
}
input.upper { text-transform: uppercase; }
canvas { display: block; width: 100%; max-width: 100%; }
.warn { color: var(--bad); font-weight: 600; font-size: 15px; min-height: 1.45em; }
.toast { color: var(--good); font-weight: 600; font-size: 15px; min-height: 1.45em; }

/* builder */
.slot { margin-top: 16px; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice {
  text-align: left; background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 10px; cursor: pointer; line-height: 1.2; display: grid; gap: 3px; position: relative;
  transition: border-color .15s, background .15s, transform .1s;
}
.choice:hover { border-color: #6a6772; transform: translateY(-1px); }
.choice b { font-family: var(--display); font-size: 16px; }
.choice span { color: var(--muted); font-size: 13px; }
.choice em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
.choice[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
.choice[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 7px; right: 9px; font-size: 13px; color: var(--orange); font-weight: 700; }
.choices.locked { pointer-events: none; opacity: .55; }
.pdesc { margin-top: 8px; font-size: 14px; line-height: 1.35; color: var(--muted); }
.pdesc b { color: var(--fg); font-family: var(--display); font-weight: 700; }
/* Custom brain rules editor (builder.js renderRules) */
.rules { margin-top: 10px; display: grid; gap: 8px; padding: 10px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--bg); }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rrow + .rrow { border-top: 1px solid var(--line); padding-top: 8px; }
.rrow b { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--orange); border-radius: 6px; padding: 2px 7px; }
.rrow span { font-family: var(--display); font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.rrow select { font: inherit; font-size: 14px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; max-width: 100%; cursor: pointer; }
.rdel { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1; }
.rdel:hover { color: var(--bad); border-color: var(--bad); }
.radd { justify-self: start; padding: 7px 12px; font-size: 14px; }
.rnote { margin: 0; font-size: 13px; color: var(--muted); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 -4px 0 #0003; transition: transform .15s; }
.swatch[aria-pressed="true"] { transform: scale(1.12); outline: 3px solid var(--fg); outline-offset: 3px; }
.meter { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, #3cb877, var(--good)); transition: width .35s cubic-bezier(.3,1.4,.5,1); border-radius: 7px; }
.meter.over > i { background: linear-gradient(90deg, #d93f3f, var(--bad)); }
.wrow { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: .06em; }
.stats { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 2em; gap: 8px 10px; align-items: center; font-size: 15px; }
.stats .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.stats .bar i { display: block; height: 100%; border-radius: 5px; transition: width .4s cubic-bezier(.3,1.4,.5,1); }
.stats .n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

/* battle HUD */
.stage-card { padding: 0; overflow: hidden; }
.arena-stage { aspect-ratio: 16 / 9; }
.huds { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.hud .who { display: flex; justify-content: space-between; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.hud .who span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud .who span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hud.b .who { flex-direction: row-reverse; }
.hpbar { height: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 5px; position: relative; }
.hpbar i { position: absolute; inset: 0 auto 0 0; display: block; height: 100%; border-radius: 8px; }
.hpbar .ghost { background: #fff8; transition: width .7s ease .35s; }
.hpbar .main { transition: width .25s ease; }
.hud.b .hpbar i { inset: 0 0 0 auto; }
.hud.a .main { background: linear-gradient(90deg, #c84a12, var(--orange)); }
.hud.b .main { background: linear-gradient(270deg, #1d7fc4, var(--blue)); }
.vs-mini { font-family: var(--display); font-weight: 700; color: var(--muted); font-size: 14px; }
.stage-ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 16px 16px; }
.stage-ctrl .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; padding: 8px 12px; cursor: pointer; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--fg); }
.log { padding: 12px 16px 16px; border-top: 1px solid var(--line); font-size: 15px; max-height: 190px; overflow-y: auto; display: grid; gap: 5px; }
.log:empty::before { content: "The battle log will show every Sense, Think, and Act move here."; color: var(--muted); font-size: 14px; }
.log div { display: grid; grid-template-columns: 4.8em minmax(0, 1fr); gap: 8px; align-items: baseline; animation: logIn .25s ease-out; }
.log .chip { text-align: center; }
.log .a { color: var(--orange-hi); font-weight: 600; }
.log .b { color: var(--blue); font-weight: 600; }
.why { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; animation: logIn .35s ease-out; background: linear-gradient(180deg, #ffd23f10, transparent); }
.why h4 { margin: 0; font-family: var(--display); font-size: 19px; color: var(--gold); }
.why ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.why li { font-size: 16px; }
.why .tip { font-size: 15px; padding: 8px 10px; border-radius: 9px; border: 1.5px dashed var(--orange); background: var(--orange-soft); }
.why .tip b { font-family: var(--display); color: var(--orange-hi); }
@keyframes logIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
<style>
  /* Layout: lesson list (cards with progress) <-> one lesson at a time, stepped like a book: one card per screen with Back/Next. */
  .wrap { max-width: 980px; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .lcard { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: grid; gap: 6px; position: relative; transition: border-color .15s, transform .1s; }
  .lcard:hover { border-color: #6a6772; transform: translateY(-2px); }
  .lcard .num { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .12em; }
  .lcard h2 { font-size: 21px; }
  .lcard p { color: var(--muted); font-size: 15px; }
  .lcard .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .lcard.done { border-color: #4fd18b77; }
  .lcard .badge { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #4fd18b26; color: var(--good); }
  .progressline { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .pbar { flex: 1; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #3cb877, var(--good)); transition: width .4s; }
  .ptext { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }

  .lesson { display: grid; gap: 14px; }
  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lhead h2 { font-size: 26px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--orange); }
  .dots i.done { background: var(--good); }
  .card { min-height: 340px; display: grid; gap: 14px; align-content: start; animation: cardIn .3s ease-out; }
  @keyframes cardIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .card h3 { font-size: 15px; color: var(--orange-hi); margin: 0; }
  .card .big { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 4vw, 30px); line-height: 1.2; text-wrap: balance; }
  .card p, .card li { font-size: 18px; max-width: 62ch; }
  .card ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .stack3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .stack3 { grid-template-columns: minmax(0, 1fr); } }
  .sta { border-radius: 12px; padding: 12px; border: 1.5px solid var(--line); background: var(--bg); display: grid; gap: 4px; }
  .sta b { font-family: var(--display); font-size: 20px; }
  .sta.s b { color: var(--blue); } .sta.t b { color: var(--purple); } .sta.a b { color: var(--orange-hi); }
  .nav { display: flex; justify-content: space-between; gap: 10px; }
  .choices2 { display: grid; gap: 8px; }
  .qopt { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-size: 17px; transition: border-color .15s; }
  .qopt:hover { border-color: #6a6772; }
  .qopt.right { border-color: var(--good); background: #4fd18b1f; }
  .qopt.wrong { border-color: var(--bad); background: #ff5d5d1a; }
  .qopt:disabled { cursor: default; }
  .feedback { padding: 12px 14px; border-radius: 10px; font-size: 17px; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  .feedback.good { background: #4fd18b1f; border: 1px solid #4fd18b66; }
  .feedback.bad { background: #ff5d5d14; border: 1px solid #ff5d5d55; }
  .feedback b { font-family: var(--display); }
  /* interactives */
  .ron { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .ritem { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 8px; }
  .ritem b { font-family: var(--display); font-size: 18px; }
  .ritem .btns { display: flex; gap: 6px; }
  .ritem .btns button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-hi); cursor: pointer; font-weight: 600; }
  .ritem.right { border-color: var(--good); } .ritem.wrong { border-color: var(--bad); }
  .ritem small { font-size: 14px; color: #d9d5de; }
  .match { display: grid; gap: 8px; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); }
  .mrow.right { border-color: var(--good); } .mrow.wrong { border-color: var(--bad); }
  .mrow select { font: inherit; font-size: 15px; background: var(--panel-hi); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .mini { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 640px) { .mini { grid-template-columns: minmax(0, 1fr); } }
  .mini canvas { aspect-ratio: 4 / 3; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 7px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-size: 15px; }
  .chips button[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
  .chips em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
  .lbl { font-size: 14px; color: var(--muted); margin: 6px 0 4px; text-transform: uppercase; letter-spacing: .08em; font-family: var(--display); }
  .readout { font-family: var(--mono); font-size: 15px; }
  .readout b { font-size: 26px; display: block; }
  .slider { display: grid; gap: 4px; }
  .slider .row { display: flex; justify-content: space-between; font-size: 16px; }
  .slider .row b { font-family: var(--mono); background: var(--orange); color: var(--ink); border-radius: 6px; padding: 0 7px; }
  input[type=range] { width: 100%; accent-color: var(--orange); height: 28px; }
  .verdict { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 17px; }
  /* sensor lessons: simulators, experiment checklists, comparison tables */
  .sim canvas { display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  @media (max-width: 560px) { .sim canvas { aspect-ratio: 3 / 2; } }
  .sim.room canvas { aspect-ratio: 5 / 3; touch-action: none; cursor: grab; }
  .simrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .simout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .card .tasks li { font-size: 16px; color: var(--muted); }
  .tasks li::before { content: "○ "; font-family: var(--mono); }
  .tasks li.done { color: var(--fg); }
  .tasks li.done::before { content: "✓ "; color: var(--good); }
  .chips button:disabled { opacity: .45; cursor: default; }
  .chips button.right { border-color: var(--good); background: #4fd18b1f; }
  .chips button.wrong { border-color: var(--bad); background: #ff5d5d1a; }
  .card .hint { font-size: 15px; color: var(--muted); margin: 0; }
  .card .formula { font-family: var(--mono); font-size: 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; width: fit-content; max-width: 100%; margin: 0; }
  .part { width: min(100%, 360px); height: auto; display: block; }
  .rtab { width: 100%; border-collapse: collapse; font-size: 16px; }
  .rtab th, .rtab td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }

      { n: "Custom", d: "Follows your rules", tip: "Does what your if-then rules say, checked top to bottom every turn. Good rules make it strong.", wt: 0, def: 1, custom: true, powerDmg: 8, powerAcc: 16, aimAcc: 50, aimDmg: 1, counter: 14 },

  function drawBot(ctx, b, x, gy, s, dir, t, o = {}) {

  const TANK = { kg: 40, air: 12, liters: 60, cost: 8000, max: 8 }; // kg includes the air inside
  const NOZZLE = { kg: 4, cost: 3000, thrust: 1600, flow: 4, flipFlow: 2 }; // flow = kg of air per second while firing
  const LIMITS = { lift: 16, push: 4, flip: 4 };
  const COMPUTERS = [
    { n: "None", kg: 0, cost: 0, d: "No sensors. Nobody keeps the car level." },
    { n: "Stabilizer", kg: 5, cost: 8000, d: "Gyro sensor keeps the car level and fires a landing cushion." },
    { n: "Pro computer", kg: 8, cost: 25000, d: "Everything the stabilizer does, plus flips and perfect cushion timing." },
  ];
  const GEARS = [
    { n: "Standard", kg: 0, cost: 0, absorb: 7, stroke: 0.3, d: "Normal car springs" },
    { n: "Sport", kg: 30, cost: 10000, absorb: 9.5, stroke: 0.6, d: "Stiffer, longer suspension" },
    { n: "Racing", kg: 60, cost: 25000, absorb: 12, stroke: 1.0, d: "Long-travel shocks for big drops" },
  ];
  const PERSON_KG = 80;
  const RAMPS = [{ n: "Low", deg: 10 }, { n: "Medium", deg: 18 }, { n: "Steep", deg: 25 }];
  const RAMP_LEN = 5;
  const FLIP_ARM = 1.8;

  // ---------------- obstacles ----------------
  // kind is used for drawing; h = height (m), w = length (m)
  const VEH = {
    sedan: { kind: "sedan", h: 1.45, w: 4.7, label: "Sedan" },
    suv: { kind: "suv", h: 1.7, w: 4.8, label: "SUV" },
    pickup: { kind: "pickup", h: 1.9, w: 5.7, label: "Pickup truck" },
    cab: { kind: "cab", h: 1.5, w: 4.3, label: "Robotaxi" },
    tractor: { kind: "tractor", h: 4.0, w: 7.0, label: "Semi truck" },
    semi: { kind: "semi", h: 4.0, w: 20.0, label: "Semi truck with trailer" },
  };
  function row(list, start = 8, gap = 0.8) {
    let x = start;
    return list.map((k) => { const v = { ...VEH[k], x }; x += v.w + gap; return v; });
  }

  // ---------------- missions ----------------
  // need: requirements beyond "land safely". stars: [complete, smooth landing, efficiency goal]
  const MISSIONS = [
    { id: "hop", n: "First Flight", goal: "Use your thrusters to stay in the air for at least 2 seconds, then land safely.",
      obstacles: [], need: { airtime: 2 }, eff: { kind: "kg", max: 1100, text: "Car weighs under 1,100 kg" } },
    { id: "car", n: "Car Hop", goal: "Jump over a parked car and land safely on the other side.",
      obstacles: row(["sedan"], 20), need: {}, eff: { kind: "cost", max: 120000, text: "Costs under $120,000" } },
    { id: "semi", n: "Semi Jump", goal: "Clear a semi truck with its trailer. It's 4 meters tall and 20 meters long.",
      obstacles: row(["semi"], 14), need: {}, eff: { kind: "kg", max: 1250, text: "Car weighs under 1,250 kg" } },
    { id: "flip", n: "Backflip", goal: "Do a full backflip in the air and land on your wheels.",
      obstacles: [], need: { flip: true }, eff: { kind: "cost", max: 190000, text: "Costs under $190,000" } },
    { id: "five", n: "Five in a Row", goal: "Like the real demo: hop over five vehicles parked in a line, including a semi truck.",
      obstacles: row(["cab", "pickup", "tractor", "suv", "sedan"], 12, 1.2), need: {}, eff: { kind: "kg", max: 1200, text: "Car weighs under 1,200 kg" } },
    { id: "semiflip", n: "Semi Flip", goal: "Clear the semi truck AND do a backflip on the way over.",
      obstacles: row(["semi"], 14), need: { flip: true }, eff: { kind: "cost", max: 230000, text: "Costs under $230,000" } },
    { id: "people", n: "Passenger Safety", goal: "Carry 2 passengers over the semi truck. The landing must be gentle: under 6 g.",
      obstacles: row(["semi"], 14), need: { people: 2, maxG: 6 }, eff: { kind: "cost", max: 220000, text: "Costs under $220,000" } },
    { id: "budget", n: "Budget Engineer", goal: "Clear the semi truck while spending less than $150,000. Every dollar counts.",
      obstacles: row(["semi"], 14), need: { budget: 150000 }, eff: { kind: "kg", max: 1150, text: "Car weighs under 1,150 kg" } },
  ];
  const ZONE_END = 85; // landing zone ends here (m past the ramp)

  const DEFAULT_DESIGN = { material: 2, tanks: 3, lift: 6, push: 0, flip: 0, computer: 0, gear: 0, people: 1, speed: 50, ramp: 1, reserve: 0, flipOn: false };

  function clampDesign(d) {
    const c = (v, a, b, def) => { v = Math.round(+v); return Number.isFinite(v) ? Math.max(a, Math.min(b, v)) : def; };
    const D = DEFAULT_DESIGN;
    return {
      material: c(d.material, 0, 3, D.material), tanks: c(d.tanks, 0, TANK.max, D.tanks),
      lift: c(d.lift, 0, LIMITS.lift, D.lift), push: c(d.push, 0, LIMITS.push, D.push), flip: c(d.flip, 0, LIMITS.flip, D.flip),
      computer: c(d.computer, 0, 2, D.computer), gear: c(d.gear, 0, 2, D.gear), people: c(d.people, 0, 2, D.people),
      speed: c(d.speed, 20, 60, D.speed), ramp: c(d.ramp, 0, 2, D.ramp), reserve: [0, 15, 30, 45].includes(+d.reserve) ? +d.reserve : 0,
      flipOn: !!d.flipOn,
    };
  }

  // ---------------- design sheet ----------------
  function sheet(d) {
    const M = MATERIALS[d.material], C = COMPUTERS[d.computer], R = GEARS[d.gear];
    const nozzles = d.lift + d.push + d.flip;
    const parts = [
      ["Frame, wheels, motors", BASE.kg, BASE.cost],
      [`${M.n} body`, M.kg, M.cost],
      [`${d.tanks} air tank${d.tanks === 1 ? "" : "s"}`, d.tanks * TANK.kg, d.tanks * TANK.cost],
      [`${nozzles} nozzle${nozzles === 1 ? "" : "s"}`, nozzles * NOZZLE.kg, nozzles * NOZZLE.cost],
      [`${C.n === "None" ? "No" : C.n} flight computer`, C.kg, C.cost],
      [`${R.n} landing gear`, R.kg, R.cost],
      [`${d.people} passenger${d.people === 1 ? "" : "s"}`, d.people * PERSON_KG, 0],
    ];
    const kg = parts.reduce((a, p) => a + p[1], 0), cost = parts.reduce((a, p) => a + p[2], 0);
    const weight = kg * G, lift = d.lift * NOZZLE.thrust, push = d.push * NOZZLE.thrust;
    const air = d.tanks * TANK.air, flowAll = (d.lift + d.push) * NOZZLE.flow;
    const useAir = air * (1 - d.reserve / 100);
    const burn = flowAll ? useAir / flowAll : 0;
    const tw = weight ? lift / weight : 0;
    const strength = R.absorb + M.str;
    const inertia = kg * (CAR_LEN * CAR_LEN + CAR_H * CAR_H) / 12;
    const flipAlpha = d.flip ? (d.flip * NOZZLE.thrust * FLIP_ARM) / inertia : 0;
    const flipTime = flipAlpha ? 2 * Math.sqrt((2 * Math.PI) / flipAlpha) : Infinity;
    return { parts, kg, cost, weight, lift, push, air, burn, tw, strength, inertia, flipAlpha, flipTime, liters: d.tanks * TANK.liters };
  }

  // ---------------- simulation ----------------
  function simulate(design, mission) {
    const d = clampDesign(design), S = sheet(d), M = mission || MISSIONS[0];
    const obs = M.obstacles;
    const th = (RAMPS[d.ramp].deg * Math.PI) / 180, v0 = d.speed / 3.6;
    let x = 0, y = RAMP_LEN * Math.sin(th), vx = v0 * Math.cos(th), vy = v0 * Math.sin(th);
    let p = th, w = 0, m = S.kg, air = S.air;
    const reserveAir = S.air * (d.reserve / 100);
    const ctrl = d.computer > 0 && d.lift >= 2; // stabilizer needs lift nozzles to steer with
    const wantFlip = d.flipOn && d.computer === 2 && d.flip >= 2;
    if (d.computer === 0) w = -0.5; // front wheels leave the ramp first: nose starts dropping
    const dt = 1 / 240, frames = [];
    let t = 0, maxY = y, maxYx = x, liftOff = false, burnEnd = null, cushionUsed = 0, cushionStart = null;
    let flipTarget = 2 * Math.PI, flipDone = false, flipAngle = 0, startP = p, minAbove = Infinity, result = null;
    let airOutT = null, flipAirOut = false, flipStartT = null;
    // the Pro computer keeps enough air to finish the flip, and climbs with the rest first
    const flipAirNeed = wantFlip && Number.isFinite(S.flipTime) ? d.flip * NOZZLE.flipFlow * S.flipTime * 1.1 : 0;
    const y0 = y;
    while (t < 14) {
      const up = { x: -Math.sin(p), y: Math.cos(p) }, fwd = { x: Math.cos(p), y: Math.sin(p) };
      const upright = Math.cos(p) > 0.3;
      // --- what fires this step ---
      let liftOn = false, pushOn = false, flipF = 0, cushion = false;
      const mainAir = air > reserveAir + (wantFlip && !flipDone ? flipAirNeed : 0) + 1e-9;
      const flipping = wantFlip && !flipDone && t > 0.12 && (!mainAir || !(d.lift || d.push));
      const aligned = Math.cos(p) > 0.85; // mid-flip the computer only fires when the car points the right way
      if (mainAir && (d.lift || d.push)) {
        liftOn = d.lift > 0 && (!ctrl || (flipping ? aligned : upright));
        pushOn = d.push > 0 && (!flipping || aligned);
      }
      if (!mainAir && burnEnd == null && (d.lift || d.push)) burnEnd = t;
      // landing cushion: needs a computer, saved air, and the car coming down
      if (!liftOn && ctrl && air > 1e-9 && vy < 0 && upright && d.lift) {
        const a = (d.lift * NOZZLE.thrust) / m - G, v = -vy;
        let trig = 2.5; // the Stabilizer always fires at 2.5 m
        if (d.computer === 2) { // the Pro computer times it so the air lasts until touchdown
          const tAir = air / (d.lift * NOZZLE.flow);
          if (a <= 0) trig = v * tAir - 0.5 * a * tAir * tAir;
          else trig = a * tAir >= v ? (v * v) / (2 * a) + 0.2 : v * tAir - 0.5 * a * tAir * tAir;
        }
        if (y <= trig) { cushion = true; liftOn = true; }
      }
      // flip control (Pro computer)
      if (flipping && air > 1e-9) {
        if (flipStartT == null) flipStartT = t;
        const rem = flipTarget - p, stop = (w * w) / (2 * Math.max(S.flipAlpha, 1e-6));
        if (rem > 0.06 || Math.abs(w) > 0.4) flipF = rem > stop ? 1 : -1;
        else flipDone = true;
      }
      if (wantFlip && !flipDone && air <= 1e-9) flipAirOut = true;
      // --- forces ---
      let ax = 0, ay = -G, flow = 0;
      // with a computer the lift nozzles are aimed straight down (thrust vectoring); without one they follow the car's tilt
      const liftDir = ctrl && !flipping ? { x: 0, y: 1 } : up;
      if (liftOn) { const F = d.lift * NOZZLE.thrust; ax += (F * liftDir.x) / m; ay += (F * liftDir.y) / m; flow += d.lift * NOZZLE.flow; liftOff = true; if (cushion) { cushionUsed += d.lift * NOZZLE.flow * dt; if (cushionStart == null) cushionStart = t; } }
      if (pushOn) { const F = d.push * NOZZLE.thrust; ax += (F * fwd.x) / m; ay += (F * fwd.y) / m; flow += d.push * NOZZLE.flow; }
      if (flipF) flow += d.flip * NOZZLE.flipFlow;
      // --- rotation ---
      let alpha = 0;
      if (flipF) alpha = flipF * S.flipAlpha;
      else if (ctrl && !flipping) {
        const target = wantFlip && (flipDone || flipStartT != null) ? flipTarget : 0;
        alpha = -16 * (p - target) - 7 * w;
      } else if (!ctrl && liftOn) alpha = 0.12 * d.lift; // uneven thrust nobody corrects
      // --- integrate ---
      vx += ax * dt; vy += ay * dt; x += vx * dt; y += vy * dt;
      w += alpha * dt; p += w * dt;
      if (flow) { const used = Math.min(air, flow * dt); air -= used; m -= used; if (air <= 1e-9 && airOutT == null) airOutT = t; }
      t += dt;
      if (y > maxY) { maxY = y; maxYx = x; }
      // obstacle clearance + collisions
      for (const o of obs) {
        if (x + HALF > o.x && x - HALF < o.x + o.w) {
          minAbove = Math.min(minAbove, y - o.h);
          if (y < o.h) {
            const fromAbove = y - vy * dt >= o.h - 0.05;
            result = { type: fromAbove ? "crash_top" : "crash_side", obstacle: o };
          }
        }
      }
      if (frames.length === 0 || t - frames[frames.length - 1].t >= 1 / 60 - 1e-9) {
        frames.push({ t, x, y, p, lift: liftOn, push: pushOn, flip: flipF, cushion, air: air / Math.max(S.air, 1e-9), vy, vx });
      }
      if (result) break;
      if (y <= 0 && t > 0.03) break;
    }
    frames.push({ t, x, y: Math.max(y, result ? y : 0), p, lift: false, push: false, flip: 0, cushion: false, air: air / Math.max(S.air, 1e-9), vy, vx, end: true });
    const flightTime = t;
    const vImp = Math.max(0, -vy);
    const pitchDeg = ((((p * 180) / Math.PI) % 360) + 540) % 360 - 180; // -180..180
    flipAngle = ((p - startP) * 180) / Math.PI;
    const R = GEARS[d.gear];
    const gForce = (vImp * vImp) / (2 * R.stroke) / G;
    let outcome;
    if (result) outcome = result.type;
    else if (Math.abs(pitchDeg) > 25) outcome = Math.abs(pitchDeg) > 120 ? "crash_upside" : "crash_angle";
    else if (vImp > S.strength) outcome = "crash_hard";
    else if (x > ZONE_END) outcome = "overshoot";
    else if (obs.length && x - HALF < Math.max(...obs.map((o) => o.x + o.w))) outcome = "short";
    else outcome = "landed";
    const landing = outcome === "landed" ? (vImp > S.strength * 0.75 ? "hard" : "smooth") : null;
    return {
      design: d, sheet: S, mission: M, frames, outcome, landing, obstacle: result && result.obstacle,
      flightTime, landX: x, maxY, maxYx, vImp, gForce, pitchDeg, flipAngle, burnEnd, airOutT, liftOff,
      cushionUsed, cushionStart, reserveAir, minAbove, wantFlip, flipAirOut, ctrl, y0, flipStartT, flipAirNeed,
      vx0: v0 * Math.cos(th), vy0: v0 * Math.sin(th),
    };
  }
  function groundBelow(x, obs) {
    let g = 0;
    for (const o of obs) if (x + HALF > o.x && x - HALF < o.x + o.w) g = Math.max(g, o.h);
    return g;
  }

  // ---------------- grading ----------------
  function grade(r) {
    const M = r.mission, d = r.design, S = r.sheet, need = M.need || {};
    const fails = [];
    if (need.people && d.people < need.people) fails.push("people");
    if (need.budget && S.cost > need.budget) fails.push("budget");
    if (r.outcome !== "landed") fails.push("outcome");
    if (need.airtime && r.flightTime < need.airtime) fails.push("airtime");
    const flipped = Math.abs(r.flipAngle) >= 330;
    if (need.flip && !flipped) fails.push("flip");
    if (need.maxG && r.outcome === "landed" && r.gForce > need.maxG) fails.push("gforce");
    const complete = fails.length === 0;
    const smooth = complete && r.landing === "smooth";
    const eff = M.eff, effVal = eff.kind === "kg" ? S.kg : S.cost;
    const effOk = complete && effVal <= eff.max;
    return { complete, fails, flipped, stars: [complete, smooth, effOk], effVal };
  }

  // ---------------- explanations ----------------
  const fmt = (n, dp = 1) => Number(n).toFixed(dp).replace(/\.0$/, "");
  const kN = (n) => fmt(n / 1000) + " kN";
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const kg = (n) => Math.round(n).toLocaleString("en-US") + " kg";

  function explain(r, g) {
    const d = r.design, S = r.sheet, M = r.mission, out = [];
    const item = (tone, title, text) => out.push({ tone, title, text });
    // headline
    let headline;
    if (g.complete) headline = { tone: "good", text: g.stars.every(Boolean) ? "Mission complete with all 3 stars!" : "Mission complete!" };
    else headline = { tone: "bad", text: "Not yet. Here's what happened and why." };

    // budget / people gates
    if (g.fails.includes("budget")) item("bad", "Over budget", `Your car costs ${money(S.cost)}, but this mission's budget is ${money(M.need.budget)}. The most expensive parts are carbon fiber (${money(MATERIALS[3].cost)}), the Pro computer, racing gear and extra tanks.`);
    if (g.fails.includes("people")) item("bad", "Missing passengers", `This mission needs ${M.need.people} passengers, but your car has ${d.people}. Passengers add ${PERSON_KG} kg each, so you'll need more thrust.`);

    // thrust vs weight
    if (d.lift === 0) item("bad", "No lift thrusters", "Your car has no nozzles pointing down, so nothing pushes it up. The ramp alone gave it a short hop.");
    else if (S.tw < 1) item("bad", "Thrust is less than weight", `Your lift thrust is ${kN(S.lift)}, but gravity pulls on your ${kg(S.kg)} car with ${kN(S.weight)}. Thrust-to-weight is ${fmt(S.tw, 2)}. Below 1.0 the nozzles can't lift the car by themselves. The ramp threw it up, and the thrust only slowed its fall.`);
    else item(S.tw >= 1.3 ? "good" : "info", "Thrust beat weight", `Lift thrust ${kN(S.lift)} vs weight ${kN(S.weight)}: thrust-to-weight ${fmt(S.tw, 2)}. Above 1.0 means the nozzles can push the car up. Higher means it climbs faster.`);

    // air supply
    if (d.tanks === 0 && d.lift + d.push + d.flip > 0) item("bad", "No air tanks", "The nozzles had no air to blow out. Cold-gas thrusters need compressed air from tanks.");
    else if (d.lift + d.push > 0 && S.tw >= 1) {
      const t = r.burnEnd != null ? r.burnEnd : S.burn;
      item("info", "Air supply", `Your ${S.liters} L of air (${d.tanks} tank${d.tanks === 1 ? "" : "s"}) ran the thrusters for ${fmt(t)} s${d.reserve ? `, keeping ${d.reserve}% for the landing` : ""}. When the air runs out, the push stops and gravity takes over. More tanks = longer push, but each tank adds ${TANK.kg} kg.`);
    }

    // height & distance vs obstacles
    const obs = M.obstacles;
    if (obs.length) {
      const tallest = Math.max(...obs.map((o) => o.h)), end = Math.max(...obs.map((o) => o.x + o.w));
      if (r.outcome === "crash_side") item("bad", `Hit the side of the ${r.obstacle.label.toLowerCase()}`, `The car only got ${fmt(Math.max(0, r.maxY))} m high, but the ${r.obstacle.label.toLowerCase()} is ${fmt(r.obstacle.h)} m tall. You need more height: more thrust, a lighter car, or more air.`);
      else if (r.outcome === "crash_top") item("bad", `Came down on top of the ${r.obstacle.label.toLowerCase()}`, `You got high enough (${fmt(r.maxY)} m) but ran out of distance. The car came down at ${fmt(r.landX)} m and the vehicles end at ${fmt(end)} m. Go faster up the ramp, add push nozzles, or stay in the air longer.`);
      else if (r.outcome !== "short") item("good", "Cleared the vehicles", `Peak height ${fmt(r.maxY)} m over a ${fmt(tallest)} m obstacle, with ${fmt(Math.max(0, r.minAbove))} m to spare at the closest point.`);
    } else {
      item("info", "Flight", `Peak height ${fmt(r.maxY)} m, ${fmt(r.flightTime)} s in the air, landed ${fmt(r.landX)} m from the ramp.`);
      if (g.fails.includes("airtime")) item("bad", "Not enough air time", `You were airborne for ${fmt(r.flightTime)} s. The goal is ${M.need.airtime} s. Stronger thrust or more air keeps you up longer.`);
    }
    if (r.outcome === "short") item("bad", "Landed before the vehicles", `The car came down at ${fmt(r.landX)} m, but the vehicles start at ${fmt(obs[0].x)} m and end at ${fmt(Math.max(...obs.map((o) => o.x + o.w)))} m. It has to fly all the way over them. Add thrust and air, or go faster.`);
    if (r.outcome === "overshoot") item("bad", "Flew past the landing zone", `You landed at ${fmt(r.landX)} m, but the safe landing zone ends at ${ZONE_END} m. Slow down on the ramp or use fewer push nozzles.`);

    // stability / computer
    if (!r.ctrl && (r.outcome === "crash_angle" || r.outcome === "crash_upside")) {
      item("bad", "The car tipped over in the air", `It landed tilted ${fmt(Math.abs(r.pitchDeg), 0)}° (more than 25° crashes). ${d.computer === 0 ? "Without a flight computer nobody keeps the car level." : "The flight computer needs at least 2 lift nozzles to steer with."} A flight computer uses a gyro sensor (Sense), decides how to correct (Think), and fires nozzles (Act). That's Sense, Think, Act!`);
    } else if (r.ctrl) item("good", "Flight computer kept it level", "The gyro sensed the tilt and the computer fired the nozzles to correct it. Sense, Think, Act.");
    else if (d.computer === 0 && r.flightTime > 1.2 && r.outcome === "landed") item("info", "Lucky landing", `Without a flight computer the car tilted ${fmt(Math.abs(r.pitchDeg), 0)}° by landing. A longer flight would tip it over.`);

    // flip
    if (d.flipOn || M.need.flip) {
      if (d.computer !== 2) item("bad", "No flip", "Only the Pro computer can do flips. It has to spin the car and stop it at exactly one full turn.");
      else if (d.flip < 2) item("bad", "No flip thrusters", "Add at least 2 flip nozzles. They push the front and back in opposite directions to spin the car.");
      else if (!d.flipOn) item("bad", "Flip was turned off", "Turn on Backflip in the flight plan.");
      else if (g.flipped && r.outcome === "landed") item("good", "Backflip landed!", `The car turned ${fmt(Math.abs(r.flipAngle), 0)}° in ${fmt(S.flipTime)} s. Flip speed depends on thrust and weight: heavier cars are harder to spin (more inertia).`);
      else {
        const why = S.flipTime > r.flightTime
          ? `A full flip needs about ${fmt(S.flipTime)} s with your ${d.flip} flip nozzles and ${kg(S.kg)} car, but you were only in the air ${fmt(r.flightTime)} s.`
          : r.flipAirOut ? "The tanks ran out of air in the middle of the flip, so the computer couldn't stop the spin." : "The flip wasn't finished when the car touched down.";
        item("bad", `Flip only got to ${fmt(Math.abs(r.flipAngle), 0)}°`, `${why} More flip nozzles spin faster, a lighter car is easier to spin, and more air time gives the flip time to finish.`);
      }
    }

    // too high = hard landing
    const tallest = obs.length ? Math.max(...obs.map((o) => o.h)) : 0;
    const needH = obs.length ? tallest + 1.2 : 2;
    if ((r.outcome === "crash_hard" || r.landing === "hard") && r.maxY > needH + 2) {
      item("info", "Higher isn't always better", `You peaked at ${fmt(r.maxY)} m${obs.length ? `, but you only needed about ${fmt(needH)} m to clear the ${fmt(tallest)} m vehicles` : ""}. The higher you go, the faster you fall: from ${fmt(r.maxY)} m a car hits the ground at about ${fmt(Math.sqrt(2 * G * r.maxY))} m/s. Engineers use just enough power, not the most.`);
    }
    if (r.flipStartT != null && r.flipAirNeed > 0) item("info", "Flight plan", `The Pro computer climbed first, then started the flip at ${fmt(r.flipStartT)} s. It kept ${fmt(r.flipAirNeed, 0)} kg of air for the flip${d.reserve ? " plus your saved landing air" : ""}.`);

    // landing
    if (r.outcome === "crash_hard") item("bad", "Landing was too hard", `The car hit the ground at ${fmt(r.vImp)} m/s. Your ${GEARS[d.gear].n.toLowerCase()} gear + ${MATERIALS[d.material].n.toLowerCase()} body can take ${fmt(S.strength)} m/s. Fixes: stronger gear or body, or save air for a landing cushion (needs a flight computer).`);
    else if (r.outcome === "landed") {
      const pct = Math.round((r.vImp / S.strength) * 100);
      item(r.landing === "smooth" ? "good" : "info", r.landing === "smooth" ? "Smooth landing" : "Hard landing (but it survived)", `Touched down at ${fmt(r.vImp)} m/s. Your car can take ${fmt(S.strength)} m/s, so that used ${pct}% of its strength.${d.people ? ` Passengers felt ${fmt(r.gForce)} g.` : ""}`);

    if (!bub) { bub = document.createElement("div"); bub.className = "tipbub"; bub.id = "tipbub"; bub.setAttribute("role", "tooltip"); document.body.appendChild(bub); }
    return bub;
  }
  function show(t) {
    const text = t.getAttribute("data-tip");
    if (!text || !t.isConnected) return;
    const b = bubble(); hide(); cur = t;
    b.textContent = text; b.classList.remove("on", "below"); b.style.left = "0px"; b.style.top = "0px";
    const r = t.getBoundingClientRect(), bw = b.offsetWidth, bh = b.offsetHeight, W = document.documentElement.clientWidth;
    let top = r.top - bh - 9, below = false;
    if (top < 6) { top = r.bottom + 9; below = true; }
    const left = Math.max(6, Math.min(W - bw - 6, r.left + r.width / 2 - bw / 2));
    b.style.left = left + "px"; b.style.top = top + "px";
    b.style.setProperty("--ax", Math.max(12, Math.min(bw - 12, r.left + r.width / 2 - left)) + "px");
    b.classList.toggle("below", below); b.classList.add("on");
    t.setAttribute("aria-describedby", "tipbub");
  }
  function hide() {
    clearTimeout(showT); clearTimeout(hideT);
    if (cur) cur.removeAttribute("aria-describedby");
    cur = null; byTouch = false; if (bub) bub.classList.remove("on");
  }
  const tipOf = (e) => (e.target && e.target.closest ? e.target.closest("[data-tip]") : null);

  document.addEventListener("pointerover", (e) => {
    if (e.pointerType === "touch") return;
    const t = tipOf(e); if (!t || t === cur) return;
    clearTimeout(showT); showT = setTimeout(() => show(t), 280);
  });
  document.addEventListener("pointerout", (e) => {
    if (e.pointerType === "touch") return;
    const t = tipOf(e); if (!t || (e.relatedTarget && t.contains(e.relatedTarget))) return;
    clearTimeout(showT); if (t === cur) hide();
  });
  document.addEventListener("pointerdown", (e) => {
    const t = tipOf(e);
    if (e.pointerType !== "touch" || !t) { hide(); return; } // a click hides the tip so it never covers the result
    show(t); byTouch = true; hideT = setTimeout(hide, 3500);
  }, true);
  document.addEventListener("focusin", (e) => { const t = tipOf(e); if (t && t.matches(":focus-visible")) show(t); });
  // a tapped button often gets redrawn (part pickers), which drops focus; the touch timer hides those tips instead
  document.addEventListener("focusout", (e) => { if (!byTouch && tipOf(e) === cur) hide(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  // only when the scrolling area holds the tipped element (the battle log scrolls on its own during fights)
  window.addEventListener("scroll", (e) => { if (cur && (e.target === document || (e.target.contains && e.target.contains(cur)))) hide(); }, true);
  window.addEventListener("resize", hide);
})();

</script>

<script>
/*
 * Live presence: tells the server which page this device is on, plus a lesson or mission number,
 * and fills in "N online now" on pages that have an #online element.
 * Students who joined a game also send their saved game pass, so the teacher's board can show
 * "LESSON 6" next to their name. Only numbers are sent, never text.
 * Does nothing in the offline backups (no server, no Socket.IO).
 */
(function () {
  if (!window.io || location.protocol === "file:") { window.Presence = { where() {} }; return; }
  const page = document.body.dataset.page;
  const socket = window.baSocket || io(); // reuse the page's own connection when it has one
  let n = 0;
  const pass = () => { try { const s = JSON.parse(localStorage.getItem("ba-session")); return s && s.code && s.playerId && s.token ? { code: s.code, playerId: s.playerId, token: s.token } : null; } catch { return null; } };
  const hello = () => socket.emit("presence:hello", { page, n, who: page === "play" ? null : pass(), watch: !!document.getElementById("online") });
  socket.on("connect", hello);
  if (socket.connected) hello();
  socket.on("presence:counts", (c) => {
    const el = document.getElementById("online"); if (!el) return;
    const bits = [`<b>${c.online}</b> online now`];
    if (c.play) bits.push(`${c.play} in games`);
    if (c.learn) bits.push(`${c.learn} in lessons`);
    if (c.lab) bits.push(`${c.lab} in the Lab`);
    if (c.practice) bits.push(`${c.practice} practicing`);
    if (c.race) bits.push(`${c.race} racing`);
    if (c.live) bits.push(`${c.live} tournament${c.live === 1 ? "" : "s"} live`);
    el.innerHTML = `<i></i>${bits.join(" · ")}`; el.hidden = false;
  });
  // Browsers keep recent pages alive for the Back button; a page left that way shouldn't count as online.
  addEventListener("pagehide", () => socket.disconnect());
  addEventListener("pageshow", (e) => { if (e.persisted) socket.connect(); });
  window.Presence = { where(num) { n = num | 0; socket.emit("presence:where", { n }); } };
})();

</script>

  const LESSONS = [
    {
      id: "robot", n: "What makes a robot?", about: "Sense, Think, Act: the three things every robot does.",
      steps: [
        { type: "read", html: `<p class="big">A robot is a machine that can <b>Sense</b>, <b>Think</b>, and <b>Act</b>, all on its own.</p>
          <div class="stack3"><div class="sta s"><b>Sense</b><span>Notice the world with sensors, like a camera or a touch sensor.</span></div>

        { type: "read", html: `<h3>Example: a robot vacuum</h3>

        { type: "quiz", q: "The robot arm's camera spots a red block. Which part is that?", options: ["Sense", "Think", "Act"], answer: 0, explain: "Seeing the block is sensing. Then the computer thinks, and the servos act." },
      ],
      next: { label: "Build your first robot", href: "bot-arena-offline.html" },
    },
    {
      id: "sensors", n: "Robot senses", about: "Cameras, ultrasonic, touch and gyro sensors, and how they work.",
      steps: [
        { type: "read", html: `<p class="big">Sensors are a robot's senses.</p>
          <ul><li><b>Camera:</b> sees colors and shapes, like your eyes.</li>
          <li><b>Ultrasonic:</b> measures distance with sound you can't hear, like a bat.</li>
          <li><b>Touch:</b> feels when it bumps into something.</li>
          <li><b>Gyro:</b> feels tilting and turning, like your inner ear.</li></ul>` },
        { type: "read", html: `<h3>How an ultrasonic sensor measures distance</h3>
          <p>It sends out a short beep and times how long the echo takes to come back. Sound travels about <b>343 meters per second</b>.</p>
          <p>The sound goes there <i>and</i> back, so: <b>distance = 343 × time ÷ 2</b>.</p>
          <p>Example: the echo comes back in 0.01 seconds. 343 × 0.01 ÷ 2 ≈ <b>1.7 meters</b> to the wall.</p>` },
        { type: "interactive", kind: "match" },
        { type: "quiz", q: "An ultrasonic echo comes back in 0.02 seconds. About how far away is the wall?", options: ["0.7 m", "3.4 m", "6.9 m", "343 m"], answer: 1, explain: "343 × 0.02 = 6.86 meters there and back. Divide by 2: about 3.4 m." },
        { type: "quiz", q: "In Bot Arena, which sensor gives a robot the best aim?", options: ["Camera", "Ultrasonic", "Touch"], answer: 0, explain: "The camera sees the target clearly. Ultrasonic helps you dodge, and Touch is light but aims poorly." },

      next: { label: "Pick a sensor for your robot", href: "bot-arena-offline.html" },
    },
    {
      id: "ultrasonic", n: "Ultrasonic: seeing with sound", about: "How a robot measures distance with echoes, and what can fool it.",
      steps: [
        { type: "read", html: `<p class="big">An ultrasonic sensor finds things the way a bat does: it chirps, then listens for the echo.</p>
          <svg class="part" viewBox="0 0 360 170" role="img" aria-label="An ultrasonic sensor: a small blue board with two round silver cans. The left one is a speaker, the right one is a microphone.">
            <rect x="30" y="52" width="300" height="88" rx="10" fill="#2468b3" stroke="#141316" stroke-width="3"/>
            <g stroke="#141316" stroke-width="3" fill="#cfd2d8"><circle cx="110" cy="96" r="34"/><circle cx="250" cy="96" r="34"/></g>
            <g fill="#6f727a"><circle cx="110" cy="96" r="23"/><circle cx="250" cy="96" r="23"/></g>
            <g fill="#141316"><rect x="159" y="140" width="6" height="20"/><rect x="171" y="140" width="6" height="20"/><rect x="183" y="140" width="6" height="20"/><rect x="195" y="140" width="6" height="20"/></g>
            <g font-family="JetBrains Mono, monospace" text-anchor="middle"><text x="110" y="22" fill="#f4f1ea" font-size="15" font-weight="700">SPEAKER</text><text x="110" y="40" fill="#aaa6b0" font-size="12">sends the chirp</text>
            <text x="250" y="22" fill="#f4f1ea" font-size="15" font-weight="700">MICROPHONE</text><text x="250" y="40" fill="#aaa6b0" font-size="12">hears the echo</text></g>
          </svg>
          <p>The chirp vibrates <b>40,000 times per second</b>. People can only hear up to about 20,000, so it's too high for us. That's why it's called <b>ultra</b>sonic: beyond sound.</p>` },
        { type: "read", html: `<h3>Time the echo</h3>
          <p>The sensor starts a timer when it chirps and stops it when the echo comes back. Sound travels about <b>343 meters per second</b>, and it goes there <i>and</i> back, so:</p>
          <p class="formula">distance = 343 × time ÷ 2</p>
          <p>The times are tiny, so we use <b>milliseconds (ms)</b>, thousandths of a second. An echo after 10 ms means 343 × 0.010 ÷ 2 ≈ <b>1.7 m</b>.</p>
          <p>The chirp spreads out in a <b>cone</b>, like a flashlight beam. The sensor reports the closest thing inside the cone.</p>` },
        { type: "interactive", kind: "sonar" },
        { type: "read", html: `<h3>Why some things fool it</h3>
          <ul><li><b>Soft things</b> like pillows, couches, and curtains soak up sound instead of bouncing it back.</li>
          <li><b>Tilted walls</b> can bounce the sound off to the side, like a ball hitting a wall at an angle. Then the echo never reaches the microphone.</li>
          <li><b>Far things:</b> sound gets weaker as it spreads out. A typical classroom sensor can't hear echoes from more than about <b>4 m</b> away.</li></ul>
          <p>Every time, the robot hears nothing and thinks the path is clear. That's how robots crash!</p>` },
        { type: "quiz", q: "The echo comes back after 6 ms (0.006 seconds). About how far away is the wall?", options: ["0.5 m", "1.0 m", "2.1 m", "3.4 m"], answer: 1, explain: "343 × 0.006 = 2.06 m there and back. Divide by 2: about 1.0 m." },
        { type: "quiz", q: "Why did the tilted wall fool the sensor?", options: ["Tilted walls are always too far away", "The echo bounced off to the side and never came back", "The wall soaked up the sound", "Sound can't hit walls"], answer: 1, explain: "Sound bounces like a ball. Off a tilted wall it goes sideways, so the microphone never hears it." },
        { type: "quiz", q: "In Bot Arena, what does the Ultrasonic sensor help your robot do best?", options: ["Aim perfectly", "Dodge attacks", "Carry more weight"], answer: 1, explain: "It measures distance, so your robot dodges better. Its aim is okay, but the Camera aims best." },
      ],
      next: { label: "Give your robot an Ultrasonic sensor", href: "bot-arena-offline.html" },
    },
    {
      id: "lidar", n: "Lidar: seeing with light", about: "How a spinning laser maps a room, like a robot vacuum or a self-driving car.",
      steps: [
        { type: "read", html: `<p class="big">Lidar works like ultrasonic, but it uses a laser instead of sound.</p>
          <p><b>LIDAR</b> stands for <b>LI</b>ght <b>D</b>etection <b>A</b>nd <b>R</b>anging. Most lidars fire a tiny flash of invisible laser light and time how long the reflection takes to come back.</p>
          <p>Light is about <b>870,000 times faster</b> than sound. It travels about <b>30 cm in one nanosecond (ns)</b>, a billionth of a second. So lidar needs a super fast timer.</p>
          <p class="formula">distance = speed of light × time ÷ 2</p>` },
        { type: "read", html: `<h3>Spin it to make a map</h3>
          <p>A laser beam is thin, so it measures one exact spot. To see the whole room, many lidars <b>spin</b> and measure thousands of spots every second.</p>
          <p>Each measurement is one dot. Put the dots together and you get a map called a <b>point cloud</b>.</p>
          <ul><li><b>Robot vacuums:</b> on many of them, the round bump on top is a spinning lidar that maps your house.</li>
          <li><b>Self-driving cars:</b> many use lidar to spot cars, bikes, and people all around them.</li>
